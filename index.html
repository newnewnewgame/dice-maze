<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="サイコロで戦うターン制ローグライクRPG。ダイスを振って、装備とスキルを育てて地下20階を目指そう。20階のあとは、インフレするエンドレスが待っている。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<title>ちいさな迷宮 ダイス版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{
  --bg:#c9d4ee; --bg2:#e6ebf9;
  --win-a:#2c3ca3; --win-b:#17216f; --line:#f3f6ff;
  --ink:#f4f6ff; --dim:#bcc6f2;
  --hp:#5fe08a; --mp:#5cc8ff; --exp:#ffd45c; --bad:#ff6b6b;
  --floor-a:#0a0e33; --floor-b:#251a52;
  --die:#f4f1e8; --pip:#1b1b2c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c1b; --bg2:#12162f;
    --win-a:#1c2a7a; --win-b:#0a0f3d; --line:#dde5ff;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c1b; --bg2:#12162f;
  --win-a:#1c2a7a; --win-b:#0a0f3d; --line:#dde5ff;
}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:linear-gradient(var(--bg2),var(--bg));
  color:var(--ink);
  font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  font-size:15px;line-height:1.5;
}
button{font:inherit;color:inherit}
#app{max-width:460px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.win{
  position:relative;
  background:linear-gradient(var(--win-a),var(--win-b));
  border:3px solid var(--line);border-radius:6px;
  box-shadow:0 0 0 2px var(--win-b) inset,0 3px 0 rgba(0,0,0,.35);
  color:var(--ink);padding:10px 12px;
}
.sub{color:var(--dim);font-size:13px}

/* header */
#hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
#depth{font-size:18px}
#pips{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;justify-content:flex-end;flex-shrink:0}
.dleft{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.dleft .sub{font-size:12px}
.pip{display:block;width:10px;height:10px;border:2px solid var(--line);border-radius:2px;opacity:.8}
.pip.boss{width:12px;height:12px;transform:rotate(45deg);border-radius:1px}
.pip.done{background:var(--line);opacity:.45}
.pip.now{background:var(--exp);border-color:var(--exp);opacity:1}

/* scene */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#ename{font-size:17px}
.bar{height:12px;background:rgba(0,0,0,.45);border:2px solid var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:100%;background:var(--hp);transition:width .35s ease-out}
.bar.mp>i{background:var(--mp)}
.bar.xp>i{background:var(--exp)}
.bar.low>i{background:var(--bad)}
.stage{
  position:relative;margin-top:8px;height:196px;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;
  background:linear-gradient(var(--floor-a) 0 70%,var(--floor-b) 70% 100%);
  border:2px solid rgba(255,255,255,.35);border-radius:4px;
}
#eart{display:flex;align-items:flex-end;justify-content:center}
#eart svg{display:block}
#eart.enter{animation:enter .45s ease-out}
#eart.shake{animation:shake .28s}
#estatus{position:absolute;left:6px;top:6px;display:flex;gap:4px}
.chip{font-size:12px;line-height:1.4;border:1px solid var(--line);border-radius:3px;padding:0 6px;background:rgba(255,255,255,.12)}
.intent{margin-top:8px;font-size:14px;color:var(--dim)}
.intent b{color:var(--ink);font-weight:normal}

/* log */
#log{display:flex;flex-direction:column;justify-content:flex-end;height:7.3em;overflow:hidden;padding:8px 12px;font-size:14px}
#log div{color:var(--dim)}
#log div.new{color:var(--ink)}

/* player */
#pl.flash::after{content:"";position:absolute;inset:0;border-radius:3px;background:rgba(255,70,70,.45);animation:flash .35s ease-out forwards;pointer-events:none}
.pname{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.stat{display:grid;grid-template-columns:30px 1fr 64px;align-items:center;gap:8px;margin-top:4px}
.stat .num{text-align:right;font-size:13px}
.stat.xpr{opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}

/* commands */
.grp{color:var(--dim);font-size:13px;margin:8px 0 4px}
.grp:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cb{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;
  min-height:52px;padding:6px 10px;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.4);border-radius:4px;
}
.cb .nm{font-size:16px}
.cb .in{font-size:12px;color:var(--dim)}
.cb .res{color:var(--ink)}
.cb:hover:not(:disabled),.cb:focus-visible{background:rgba(255,255,255,.18);outline:2px solid var(--line);outline-offset:1px}
.cb:active:not(:disabled){transform:translateY(1px)}
.cb:disabled{opacity:.45;cursor:not-allowed}

/* dice */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dbtns{display:flex;gap:6px}
.sbtn{min-height:36px;padding:4px 10px;font-size:14px;white-space:nowrap;cursor:pointer;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.45);border-radius:4px}
.sbtn:hover:not(:disabled),.sbtn:focus-visible{background:rgba(255,255,255,.22);outline:2px solid var(--line);outline-offset:1px}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.dicebar{display:flex;gap:10px;justify-content:center;align-items:center;min-height:68px;margin:10px 0 4px;flex-wrap:wrap}
.die{width:56px;height:56px;padding:6px;border-radius:10px;cursor:pointer;background:var(--die);border:3px solid #2b2b40;box-shadow:0 3px 0 rgba(0,0,0,.4);transition:transform .12s}
.die .face{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%}
.die .face i{display:block;width:78%;height:78%;margin:auto;border-radius:50%}
.die .face i.on{background:var(--pip)}
.die{position:relative}
.die .big{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:30px;color:var(--pip);line-height:1}
.die .tag{position:absolute;right:-4px;bottom:-6px;font-style:normal;font-size:11px;line-height:1;padding:2px 4px;border-radius:4px;background:#2b2b40;color:#fff;border:1px solid rgba(255,255,255,.6)}
.die.t-even{background:#cfe3ff}
.die.t-high{background:#ffe3b8}
.die.t-gamble{background:#e6c9ff}
.die.t-d8{background:#c9f2d6}
.die.t-fire{background:#ffc3a8}
.die.t-gold{background:#ffe27a}
.die.t-d4{background:#d7e6ff}
.die.t-d10{background:#d2f4e4}
.die.t-odd{background:#ffd9e7}
.die.t-lucky{background:#fff0a8}
.die.t-ice{background:#bdefff}
.die.t-thunder{background:#fff19a}
.die.t-poison{background:#cde8a7}
.die.sel{transform:translateY(-6px);outline:3px solid var(--exp);outline-offset:2px}
.stage.l2{--floor-a:#1a1007;--floor-b:#4f3216}
.stage.l3{--floor-a:#05141a;--floor-b:#1d3c42}
.stage.l4{--floor-a:#10152e;--floor-b:#3a397b}
.die.used{opacity:.28;filter:grayscale(1);cursor:default}
.die.roll{animation:tumble .14s linear infinite}
.hint{text-align:center;font-size:13px;color:var(--dim);min-height:1.5em}

/* popups */
.pop{
  position:absolute;left:50%;top:42%;transform:translateX(-50%);
  font-size:30px;pointer-events:none;color:#fff;
  text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000;
  animation:pop .9s ease-out forwards;z-index:3;
}
#pl .pop{top:6px;font-size:24px}
.pop.gold{color:#ffd45c}
.eqh{font-size:13px;color:var(--dim);margin-bottom:6px}
.eq.leg b{color:var(--exp)}
.card.legend{border-color:#ffd45c;background:linear-gradient(135deg,rgba(255,212,92,.24),rgba(255,120,60,.16))}
.card.legend em{color:#ffd45c}
.eqpanel{border:2px solid rgba(255,255,255,.3);border-radius:6px;padding:8px;background:rgba(255,255,255,.06);font-size:13px;margin-bottom:2px}
.eqrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;padding:4px 6px;align-items:center}
.eqrow .es,.eqpanel .es{font-size:12px;color:var(--dim)}
.lgbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.lgbox{max-height:52vh;overflow:auto;font-size:13px;line-height:1.55;padding:8px;border:2px solid rgba(255,255,255,.3);border-radius:6px;background:rgba(0,0,0,.25);-webkit-overflow-scrolling:touch}
.lg{white-space:pre-wrap;word-break:break-all;color:var(--dim)}
.lg.battle{margin-top:10px;color:var(--exp);font-size:14px}
.lg.turn{margin-top:8px;color:var(--ink);border-top:1px solid rgba(255,255,255,.25);padding-top:4px}
.lg.roll{color:#bfe3ff}
.lg.act{color:var(--ink)}
.lg.take{color:#ffb4b4}
.lg.s{color:var(--dim)}
.eq{display:grid;grid-template-columns:62px 1fr auto;gap:2px 8px;padding:4px 6px;border-radius:5px;border:2px solid transparent;align-items:center}
.eq b.none{color:var(--dim);opacity:.7;font-weight:normal}
.mv{display:flex;gap:4px}
.mvb{min-width:34px;min-height:30px;padding:0 6px;font-size:13px;cursor:pointer;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.4);border-radius:4px}
.mvb:hover:not(:disabled),.mvb:focus-visible{background:rgba(255,255,255,.22);outline:2px solid var(--line);outline-offset:1px}
.mvb:disabled{opacity:.3;cursor:not-allowed}
.eq .es{font-size:12px;color:var(--dim)}
.eq b{font-weight:normal}
.eq .ed{grid-column:2 / span 2;font-size:12px;color:var(--dim);line-height:1.35}
.eq .ed.none{color:var(--dim);opacity:.7}
.eq.hot{background:rgba(255,212,92,.25);border-color:var(--exp)}
#casc{position:absolute;left:6px;top:34px;right:6px;display:flex;flex-direction:column;gap:2px;font-size:13px;pointer-events:none;z-index:2}
#casc .cl{width:fit-content;max-width:100%;background:rgba(5,8,40,.78);border-radius:4px;padding:1px 7px;animation:clin .18s ease-out}
#casc .cl em{font-style:normal;color:var(--exp);margin-left:4px}
#bigscore{position:absolute;right:10px;bottom:6px;font-size:44px;line-height:1;color:#fff3a8;text-shadow:0 3px 0 #000,2px 0 0 #000,-2px 0 0 #000;pointer-events:none;z-index:2}
#bigscore.pulse{animation:bpulse .22s ease-out}
@keyframes clin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes bpulse{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.tally{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:6px;margin:10px 0 6px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;border:2px solid rgba(255,255,255,.35);border-radius:8px;background:rgba(255,255,255,.07);cursor:pointer;min-height:92px;color:var(--ink)}
.tcol:hover,.tcol:focus-visible{background:rgba(255,255,255,.18);outline:2px solid var(--line);outline-offset:1px}
.tcol.zero{opacity:.4}
.tcol.top{border-color:var(--hp)}
.tcol.lock{border-color:var(--exp);background:rgba(255,212,92,.2)}
.tcol .cnt{font-size:22px;line-height:1.1}
.tcol .keep{font-size:11px;line-height:1.2;min-height:1.2em;color:var(--hp)}
.tcol.lock .keep{color:var(--exp)}
.tcol.roll .cnt{animation:flick .16s linear infinite}
.mini{display:block;width:32px;height:32px;padding:3px;border-radius:7px;background:var(--die);border:2px solid #2b2b40}
.mini .face{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%}
.mini .face i{display:block;width:80%;height:80%;margin:auto;border-radius:50%}
.mini .face i.on{background:var(--pip)}
.mini .big{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:17px;color:var(--pip);line-height:1}
.score{display:flex;justify-content:center;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0 2px}
.score b{font-weight:normal;font-size:20px}
.score .tot{font-size:26px;color:var(--exp)}
.score .jp{font-style:normal;color:#ff8a5c;font-size:13px}
.pop.big{font-size:46px;color:#fff3a8;animation:popbig 1s ease-out forwards}
#eart.shakebig{animation:shakebig .4s}
@keyframes flick{0%{transform:translateY(-2px)}50%{transform:translateY(2px)}100%{transform:translateY(-2px)}}
@keyframes popbig{0%{opacity:0;transform:translateX(-50%) scale(.6)}20%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-50px)}}
@keyframes shakebig{0%,100%{transform:translateX(0)}15%{transform:translateX(-16px) rotate(-3deg)}35%{transform:translateX(14px) rotate(3deg)}60%{transform:translateX(-9px)}80%{transform:translateX(5px)}}
.goldtxt{color:var(--exp)}
.pop.dmg{color:#ffe27a}
.pop.hurt{color:#ff8a8a}
.pop.heal{color:#8dffb0}
.pop.miss{color:#d6dcff}

/* overlay */
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:rgba(6,8,24,.82);overflow:auto}
.ov[hidden]{display:none}
.box{width:100%;max-width:420px;padding:16px;margin:auto}
.box h2{margin:0 0 4px;font-size:22px;font-weight:normal}
.box p{margin:0 0 12px}
.box ul{margin:0 0 14px;padding-left:1.1em;color:var(--dim);font-size:14px}
.box li{margin:2px 0}
#ovB{display:flex;flex-direction:column;gap:8px}
.card{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
  padding:10px 12px;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.45);border-radius:4px;
}
.card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%}
.card b{font-weight:normal;font-size:17px}
.card em{font-style:normal;font-size:12px;color:var(--exp)}
.card .cd{font-size:13px;color:var(--dim)}
.card:hover,.card:focus-visible{background:rgba(255,255,255,.2);outline:2px solid var(--line);outline-offset:1px}
.card:disabled{opacity:.45;cursor:not-allowed}
.card em.gld{color:var(--exp)}
.card.go{align-items:center;justify-content:center;margin-top:2px}

/* codex */
.cdtabs{display:flex;gap:6px;margin-bottom:4px}
.cdtab{flex:1;padding:6px 4px;text-align:center;cursor:pointer;line-height:1.3;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.35);border-radius:4px}
.cdtab small{font-size:11px;color:var(--dim)}
.cdtab.on{background:rgba(255,255,255,.22);border-color:var(--line)}
.cdh{margin:8px 0 0;font-size:13px;color:var(--exp)}
.card.cdx{cursor:default}
.card.cdx:hover{background:rgba(255,255,255,.08);outline:none}
.card.cdx.seen{opacity:.75}
.card.cdx.unk{opacity:.45}
.card.cdx.own em{color:var(--hp)}
.nw{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;font-size:11px;line-height:1.5;vertical-align:2px;background:var(--exp);color:#1c1c2e}
.nw.un{background:transparent;border:1px solid var(--exp);color:var(--exp);padding:0 4px}
.cdnote{font-size:12px;color:var(--dim);margin:0 0 4px}
@keyframes tumble{0%{transform:rotate(-12deg) translateY(-3px)}50%{transform:rotate(12deg) translateY(2px)}100%{transform:rotate(-12deg) translateY(-3px)}}
@keyframes pop{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}45%{transform:translateX(8px)}70%{transform:translateX(-5px)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* profiles */
.pfin{display:block;width:100%;box-sizing:border-box;padding:10px;margin:6px 0;font:inherit;font-size:14px;color:inherit;resize:vertical;
  background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.45);border-radius:4px}
textarea.pfin{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.pfbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pfmsg{display:block;color:var(--exp);font-size:13px;min-height:1.2em;margin:2px 0 6px}

/* 目の役割 */
.tcol .role{font-size:13px;line-height:1.1}
.roles{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px;min-height:1.4em}

/* 行動の順番 */
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:2px 0 8px}
.tlc{display:inline-flex;align-items:baseline;gap:5px;padding:4px 8px;font-size:13px;line-height:1.3;color:inherit;
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.45);border-radius:4px}
.tlc b{font-size:15px;color:var(--exp)}
button.tlc{cursor:pointer;font-family:inherit}
button.tlc:hover,button.tlc:focus-visible{background:rgba(255,255,255,.22);outline:2px solid var(--line)}
.tlc.empty{opacity:.55;border-style:dashed}
.tlc.en{background:rgba(255,110,110,.16);border-color:rgba(255,130,130,.8)}
.tla{opacity:.6;font-style:normal;padding:0 1px}

.tlhint{margin:-4px 0 6px;font-size:12px}
</style>
</head>
<body>
<main id="app">
  <header class="win" id="hdr">
    <span class="dleft"><span id="depth"></span><span class="sub" id="layer"></span></span>
    <span id="pips" aria-hidden="true"></span>
  </header>

  <section class="win" id="scene">
    <div class="row"><span id="ename"></span><span class="sub" id="ehpTxt"></span></div>
    <div class="bar" id="ebar" style="margin-top:4px"><i id="ehp"></i></div>
    <div class="stage" id="stg">
      <div id="estatus"></div>
      <div id="casc"></div>
      <div id="bigscore"></div>
      <div id="eart"></div>
    </div>
    <div class="intent" id="intent"></div>
  </section>

  <section class="win" id="log" aria-live="polite"></section>

  <section class="win" id="pl">
    <div class="pname"><span>勇者 <span id="lv"></span></span><span id="gold" class="goldtxt"></span></div>
    <div class="stat"><span>HP</span><div class="bar" id="hpbar"><i id="hp"></i></div><span class="num" id="hpTxt"></span></div>
    <div class="stat"><span>MP</span><div class="bar mp"><i id="mp"></i></div><span class="num" id="mpTxt"></span></div>
    <div class="chips" id="chips"></div>
    <div class="sub" id="rec" style="margin-top:6px"></div>
  </section>

  <section class="win" id="dice"></section>

  <section class="win" id="cmd"></section>

  <section class="win" id="equip"></section>
</main>

<div class="ov" id="ov" hidden>
  <div class="win box" role="dialog" aria-modal="true" aria-labelledby="ovT">
    <h2 id="ovT"></h2>
    <p class="sub" id="ovS"></p>
    <div id="ovB"></div>
  </div>
</div>

<script>
/* ===== 軽量 xlsx リーダー（外部ライブラリ不要）=====
   .xlsx は zip の中に XML が入ったファイル。ブラウザ標準の DecompressionStream と DOMParser だけで読む。
   readXlsx(ArrayBuffer) → { シート名: [ [セル,セル,...], ... ] }  （空のセルは undefined） */
async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined')throw new Error('このブラウザは DecompressionStream に未対応です（新しいブラウザで開いてください）');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error('xlsx（zip）として読めません');
  const count=dv.getUint16(eocd+10,true);let ptr=dv.getUint32(eocd+16,true);
  const dec=new TextDecoder('utf-8'),files={};
  for(let n=0;n<count;n++){
    if(dv.getUint32(ptr,true)!==0x02014b50)throw new Error('zipの構造が不正です');
    const method=dv.getUint16(ptr+10,true),csize=dv.getUint32(ptr+20,true);
    const nl=dv.getUint16(ptr+28,true),el=dv.getUint16(ptr+30,true),cl=dv.getUint16(ptr+32,true),off=dv.getUint32(ptr+42,true);
    const name=dec.decode(u8.subarray(ptr+46,ptr+46+nl));
    ptr+=46+nl+el+cl;
    const start=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    const data=u8.subarray(start,start+csize);
    files[name]={method,data};
  }
  const read=async name=>{
    const f=files[name];if(!f)return null;
    const bytes=f.method===0?f.data:f.method===8?await inflateRaw(f.data):null;
    if(!bytes)throw new Error('未対応の圧縮方式です: '+name);
    return dec.decode(bytes);
  };
  return {read,has:n=>!!files[n]};
}
const parseXml=s=>new DOMParser().parseFromString(s,'application/xml');
const colIndex=ref=>{let n=0;for(const ch of ref.replace(/[0-9]/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
async function readXlsx(buf){
  const z=await unzip(buf);
  // 共有文字列（ふりがな<rPh>は除く）
  const shared=[];
  const ssXml=await z.read('xl/sharedStrings.xml');
  if(ssXml){
    for(const si of parseXml(ssXml).getElementsByTagName('si')){
      let t='';
      for(const x of si.getElementsByTagName('t')){if(x.parentNode.nodeName!=='rPh')t+=x.textContent}
      shared.push(t);
    }
  }
  // シート名 → ファイル
  const wb=parseXml(await z.read('xl/workbook.xml'));
  const rels=parseXml(await z.read('xl/_rels/workbook.xml.rels'));
  const target={};
  for(const r of rels.getElementsByTagName('Relationship')){
    let t=r.getAttribute('Target');t=t.startsWith('/')?t.slice(1):'xl/'+t;
    target[r.getAttribute('Id')]=t;
  }
  const out={};
  for(const sh of wb.getElementsByTagName('sheet')){
    const path=target[sh.getAttribute('r:id')];
    const xml=path&&await z.read(path);
    if(!xml)continue;
    const rows=[];
    for(const row of parseXml(xml).getElementsByTagName('row')){
      const ri=(+row.getAttribute('r'))-1,arr=[];
      for(const c of row.getElementsByTagName('c')){
        const t=c.getAttribute('t'),vEl=c.getElementsByTagName('v')[0];
        let v;
        if(t==='inlineStr'){v='';for(const x of c.getElementsByTagName('t')){if(x.parentNode.nodeName!=='rPh')v+=x.textContent}}
        else if(!vEl||vEl.textContent==='')continue;
        else if(t==='s')v=shared[+vEl.textContent];
        else if(t==='b')v=vEl.textContent==='1';
        else if(t==='str'||t==='e')v=vEl.textContent;
        else v=Number(vEl.textContent);
        arr[colIndex(c.getAttribute('r'))]=v;
      }
      rows[ri]=arr;
    }
    out[sh.getAttribute('name')]=Array.from(rows,r=>r||[]);
  }
  return out;
}

// 敵の強さの伸び方。20階までは g1 の累乗、21階以降は「階ごとの伸び g2 と、20階ごとの段階ジャンプ jump」を CFG.endlessSpeed 乗する
const growAt=(i,g1,g2,jump)=>i<FLOORS?Math.pow(g1,i):Math.pow(g1,FLOORS-1)*Math.pow(Math.pow(g2,i-FLOORS+1)*Math.pow(jump,tierOf(i)),CFG.endlessSpeed);
const enemyHp=(i,t)=>Math.round(CFG.hp0*growAt(i,CFG.hpGrow,CFG.hpGrow2,CFG.hpJump)*(t.hm||1));
const enemyAtk=(i,t)=>Math.max(1,Math.round(CFG.atk0*growAt(i,CFG.atkGrow,CFG.atkGrow2,CFG.atkJump)*(t.am||1)));

/* ===== ダイスの集計 =====
   ダイスの種類そのもの（名前・目・価格・説明）は data/equipment.xlsx の「ダイス」シートで編集する。
   ここには、出目の集計（スキルや装備が見る P の中身）と、特殊ダイスの効果計算が入っている。 */
const R6=[1,2,3,4,5,6];
/* ===== ダイスの集計（スキルはこれを見て威力が決まる） ===== */
const matchBonus=(M,jack)=>{const b=M<=1?1:M===2?1.3:M===3?1.6:M===4?2:2+0.5*(M-4);return jack?Math.max(b*1.5,3):b};   // 揃いボーナスに上限なし（5個以上は1個ごとに+0.5）
function pool(){
  const cnt={};let S=0,sumHigh=0,sumOdd=0,odd=0,high=0,even=0;
  for(const d of p.dice){
    cnt[d.v]=(cnt[d.v]||0)+1;
    const w=d.v*(d.t==='fire'?2:d.t==='ice'&&d.v<=3?2:d.t==='thunder'&&d.v%2===0?2:d.t==='poison'&&d.v%2===1?2:1);
    S+=w;
    if(d.v>=4){sumHigh+=w;high++}
    if(d.v%2===1){sumOdd+=w;odd++}else even++;
  }
  const faces=Object.keys(cnt).map(Number).sort((a,b)=>a-b);
  let M=0;faces.forEach(f=>{M=Math.max(M,cnt[f])});
  const N=p.dice.length,jack=N>=3&&faces.length===1;
  let run=0,best=0,prev=null;
  faces.forEach(f=>{run=(prev!==null&&f===prev+1)?run+1:1;best=Math.max(best,run);prev=f});
  const pairs=faces.filter(f=>cnt[f]>=2).length;
  const eqs=p.equip?equipped():[];
  const sm=eqs.reduce((m,it)=>m*(it.sumMul||1),1);
  let mult=matchBonus(M,jack);
  if(eqs.some(it=>it.matchPow))mult=+(mult*mult).toFixed(2);
  return {cnt,S:R(S*sm),N,M,mult,jack,run:best,pairs,high,sumHigh:R(sumHigh*sm),odd,sumOdd:R(sumOdd*sm),even};
}
const tallyText=()=>{const P=pool();return Object.keys(P.cnt).map(Number).sort((a,b)=>a-b).map(f=>`${f}×${P.cnt[f]}`).join(' ')};

/* ===== 目の役割 =====
   サイコロの目（1〜6）には、それぞれ役割がある。最終的に出ている目の「個数」が多いほど、その役割が強くなる。
   役割の名前・アイコン・説明・効果の大きさは data/equipment.xlsx の「目の役割」シートで編集する（シートがなければ下の初期値）。
   キープできる目は1種類だけなので、「どの目を伸ばすか」が、そのまま「どの役割を伸ばすか」になる。
     1 速さ …… 1の目の個数が、行動の速さになる。さらに振り直し回数・行動回数も増える（効果量1＝何個ごとに振り直し+1／効果量2＝何個ごとに行動回数+1／効果量3＝1の目1個あたりの行動の速さ）
     2 耐久 …… 受けるダメージが減り、敵の状態異常にもかかりにくくなる（効果量1＝1個あたりの軽減の強さ。被ダメージ＝1÷(1＋2の個数×効果量1)／効果量2＝1個あたりの状態異常の抵抗。かかる確率＝1÷(1＋2の個数×効果量2)。「行動を実行」を押した時点の出目で決まる）
     3 会心 …… 攻撃が会心（大ダメージ）になりやすい（効果量1＝1個あたりの会心率／効果量2＝会心時のダメージ倍率。行動を予約した時点の出目で決まる）
     4 魔力 …… 魔法の目。魔法スキルは、すべて4の目が条件。行動の実行前にMP回復、魔法のダメージ増（効果量1＝1個あたりのMP／効果量2＝1個あたりの魔法ダメージ増）
     5 技巧 …… 状態異常が強くなる（効果量1＝1個あたりの強さ増。毒・火傷・出血のダメージ、弱体の軽減、弱点看破の倍率）。装備の付与確率も上がる（効果量2＝1個あたりの確率増）。毒・火傷・出血の継続ターンが延びる（効果量3＝何個ごとに+1ターン）
     6 攻撃 …… 与えるダメージが増える（効果量1＝1個あたりのダメージ増） */
const ROLE_DEFAULT={
  1:{name:'速さ',icon:'⚡',desc:'1の目の個数が、行動の速さになる。さらに、振り直しと行動回数も増える。',a:3,b:6,c:1},
  2:{name:'耐久',icon:'🛡',desc:'2の目の個数に応じて、受けるダメージが減り、敵の状態異常にもかかりにくくなる。',a:0.06,b:0.08},
  3:{name:'会心',icon:'💥',desc:'3の目の個数に応じて、攻撃が会心（大ダメージ）になりやすい。',a:0.04,b:2},
  4:{name:'魔力',icon:'🔮',desc:'魔法の目。行動の実行前にMPが回復し、魔法のダメージが増える。魔法スキルは、すべて4の目が条件。',a:0.5,b:0.06},
  5:{name:'技巧',icon:'🎯',desc:'状態異常（毒・火傷・出血・弱体・弱点看破）が強くなり、毒・火傷・出血は続く期間（ターン／回数）も延びる。装備の付与確率も上がる。',a:0.06,b:0.02,c:3},
  6:{name:'攻撃',icon:'⚔️',desc:'6の目の個数に応じて、与えるダメージが増える。',a:0.05,b:0},
};
let ROLE=ROLE_DEFAULT;
const roleCnt=(P,f)=>(P&&P.cnt&&P.cnt[f])||0;
const roleUse=(f)=>ROLE[f]||null;

function roleRerollBonus(P){const r=roleUse(1);return r&&r.a>0?Math.floor(roleCnt(P,1)/r.a):0}
function roleSpeedBonus(P){const r=roleUse(1);return r&&r.c>0?Math.floor(roleCnt(P,1)*r.c):0}   // 1の目の個数×効果量3＝行動の速さ
function roleActionBonus(P){const r=roleUse(1);return r&&r.b>0?Math.floor(roleCnt(P,1)/r.b):0}
function roleTakeMul(P){const r=roleUse(2);return r&&r.a>0?1/(1+roleCnt(P,2)*r.a):1}   // 耐久（2）：被ダメージの倍率
function roleStatusResistMul(P){const r=roleUse(2);return r&&r.b>0?1/(1+roleCnt(P,2)*r.b):1}   // 耐久（2）：敵の状態異常にかかる確率の倍率
function roleCritChance(P){const r=roleUse(3);return r&&r.a>0?Math.min(0.9,roleCnt(P,3)*r.a):0}   // 会心（3）：会心率
const roleCritMul=()=>{const r=roleUse(3);return r&&r.b>1?r.b:2};
function roleMana(P){const r=roleUse(4),c=roleCnt(P,4);return r&&r.a>0?Math.floor(c*r.a):0}
function roleMagMul(P){const r=roleUse(4);return r&&r.b>0?1+roleCnt(P,4)*r.b:1}
function roleStatusMul(P){const r=roleUse(5);return r&&r.a>0?1+roleCnt(P,5)*r.a:1}
function roleStatusDuration(P){const r=roleUse(5);return r&&r.c>0?Math.floor(roleCnt(P,5)/r.c):0}   // 毒・火傷・出血の継続ターン+
function roleWeakMul(P){const r=roleUse(5);return r&&r.a>0?0.5/(1+roleCnt(P,5)*r.a):0.5}   // 弱体：敵の次の攻撃の倍率（基本0.5）
function roleVulnMul(P){const r=roleUse(5);return r&&r.a>0?1.5+roleCnt(P,5)*r.a*0.5:1.5}   // 弱点看破：次に受けるダメージの倍率（基本1.5）
function roleChanceBonus(P){const r=roleUse(5);return r&&r.b>0?roleCnt(P,5)*r.b:0}
function roleAtkMul(P){const r=roleUse(6);return r&&r.a>0?1+roleCnt(P,6)*r.a:1}

// いまの出目で働いている役割の一覧（画面に出す）
function roleSummary(P){
  const out=[],t=(f,s)=>out.push(`${ROLE[f].icon}${ROLE[f].name} ${s}`);
  if(roleUse(1)){const a=roleRerollBonus(P),b=roleActionBonus(P),c=roleSpeedBonus(P);if(a||b||c)t(1,[a?`振り直し+${a}`:'',b?`行動+${b}`:'',c?`速さ+${c}`:''].filter(Boolean).join('・'))}
  if(roleUse(2)){const m=roleTakeMul(P),q=roleStatusResistMul(P);if(m<1)t(2,`被ダメージ×${fmtM(+m.toFixed(2))}${q<1?`・状態異常率×${fmtM(+q.toFixed(2))}`:''}`)}
  if(roleUse(3)){const c=roleCritChance(P);if(c>0)t(3,`会心${Math.round(c*100)}%（×${fmtM(roleCritMul())}）`)}
  if(roleUse(4)){const m=roleMana(P),g=roleMagMul(P);if(m>0||g>1)t(4,[m?`MP+${m}`:'',g>1?`魔法×${fmtM(g)}`:''].filter(Boolean).join('・'))}
  if(roleUse(5)){const m=roleStatusMul(P),d=roleStatusDuration(P),c=roleChanceBonus(P),v=roleVulnMul(P);const parts=[m>1?`状態異常×${fmtM(m)}`:'',d>0?`継続+${d}`:'',c>0?`付与率+${Math.round(c*100)}%`:'',v>1.5?`弱点×${fmtM(+v.toFixed(2))}`:''].filter(Boolean);if(parts.length)t(5,parts.join('・'))}
  if(roleUse(6)){const a=roleAtkMul(P);if(a>1)t(6,`ダメージ×${fmtM(a)}`)}
  return out;
}

/* ===== 速さと行動順 =====
   1ターンの流れ：サイコロを振る（振り直し） → 行動ボタンを押して「予約」する（最大 p.actions 個）→ 「行動を実行」。
   ・行動を予約した瞬間の出目が、その行動の能力になる（速さも、ダメージなどの威力も）。
     予約したあとで振り直しても、予約済みの行動は、予約した時の出目のまま。
   ・行動の速さ ＝ 1の目の個数 × 目の役割の効果量3（初期値1） ＋ 装備の「行動の速さ+」。
   ・実行は、味方の予約した行動と敵の1回の行動を「速さの大きい順」に並べて行う（同じ速さなら味方が先、味方同士は予約した順）。
   ・敵の速さ ＝ 敵の種類ごとの基本値（enemies.js の spd）＋ 階数÷CFG.enemySpeedStep（切り捨て）。 */
const enemySpeed=(i,t)=>(t.spd===undefined?1:t.spd)+Math.floor(i/CFG.enemySpeedStep);
const actionSpeed=P=>roleSpeedBonus(P)+equipped().reduce((n,it)=>n+(it.speedBonus||0),0);

// 予約した行動＋敵 を、速さの順に並べる
function planTimeline(){
  const ev=p.queue.map((q,i)=>({who:'p',q,id:q.id,spd:q.spd,slot:i}));
  ev.push({who:'e',spd:e.spd,slot:99});
  ev.sort((a,b)=>(b.spd-a.spd)||(a.who===b.who?a.slot-b.slot:(a.who==='p'?-1:1)));
  return ev;
}
const mpCost=a=>Math.max(0,(a.mp||0)-equipped().reduce((n,it)=>n+(it.mpDiscount||0),0));
const reservedMp=()=>p.queue.reduce((n,q)=>n+mpCost(ALL[q.id]),0);

function timelineHTML(){
  const free=Math.max(0,p.actions-p.queue.length);
  const chips=planTimeline().map(x=>{
    if(x.who==='e')return `<span class="tlc en">👹 ${escHtml(e.name)} 速さ<b>${x.spd}</b></span>`;
    const a=ALL[x.id],r=a.calc(x.q.P);
    const dm=r.dmg?` 約${fmt(previewFinal(r.dmg,x.q.P,a))}`:'';
    return `<button class="tlc q" data-q="${x.slot}" title="タップで予約を取り消す">${escHtml(a.name)} 速さ<b>${x.spd}</b>${dm}</button>`;
  }).join('<i class="tla">›</i>');
  return `<div class="grp">行動の順番（速さの大きい順・あと${free}回予約できる）</div><div class="tl">${chips}</div>`+
    (p.queue.length?'':'<div class="sub tlhint">行動ボタンを押すと、いまの出目で予約されます。予約したあとで振り直しても、予約は変わりません。</div>');
}

// --- 予約 ---
function syncQueue(){p.actionsUsed=p.queue.length;syncRoleBonuses()}
function queueAction(a){
  if(p.queue.length>=p.actions)return;
  const P=pool();   // いまの出目を、この行動の能力として記録する
  p.queue.push({id:a.id,P,spd:actionSpeed(P)});p.used[a.id]=true;syncQueue();render();
}
function unqueue(slot){
  const q=p.queue[slot];if(!q)return;
  p.queue.splice(slot,1);p.used[q.id]=false;syncQueue();render();
}
function clearQueue(){
  for(const q of p.queue)p.used[q.id]=false;
  p.queue=[];p.actionsUsed=0;
}

// --- 実行 ---
async function doAction(q,no,total){
  const a=ALL[q.id],P=q.P,r=a.calc(P),cost=mpCost(a);
  if(!r.ok||p.mp<cost){
    const why=!r.ok?(r.needText||a.need||'条件を満たさない'):'MPが足りない';
    rec(`【行動${no}/${total}】${a.name}は不発（${why}）`,'act');log(`${a.name}は不発！（${why}）`);render();await sleep(380);return;
  }
  p.mp-=cost;
  if(a.cd){const w=Math.max(0,a.cd-(has('haste')?1:0)-equipped().reduce((n,it)=>n+(it.cooldownReduce||0),0));if(w>0){p.cds[a.id]=w;p.cdFresh[a.id]=true;rec(`　${a.name}は${w}ターン使えなくなる`,'act')}}
  p.currentSkill=a.id;
  rec(`【行動${no}/${total}】${a.name}（速さ${q.spd}）${a.mp?`（MP${a.mp}消費）`:''}`,'act');
  rec(`　予約した時の出目：合計${fmt(P.S)}／最多${P.M}個／揃い×${fmtM(P.mult)}／ペア${P.pairs}組`,'act');
  log(`${a.name}！`,true);render();await sleep(220);
  await apply(r,P);
}
// 敵の番：状態異常のダメージ → 敵の行動
async function enemyTurn(){
  for(const [key,label] of [['poison','毒'],['burn','火傷']]){   // 出血は、時間ではなく「ダメージを受けるたび」に入る（main.js の bleedTrigger）
    const st=e[key];if(!st)continue;const wound=key==='poison'&&!!e.bleed,d=key==='poison'?Math.max(1,R(e.maxHp*st.pct*(wound?CFG.comboWound:1))):st.d;   // コンボ：重症（毒＋出血）
    if(wound)log(`💥重症！毒のダメージが×${CFG.comboWound}`,true);e.hp=Math.max(0,e.hp-d);st.t--;if(st.t<=0)e[key]=null;
    rec(`【${label}】${e.name}に${label}ダメージ${d}`,'take');log(`${label}で${e.name}に${d}のダメージ！`,true);popup('scene',d,'dmg');render();await sleep(350);
    if(e.hp<=0)return;
  }
  await enemyAct();
}
async function runTimeline(){
  busy=true;
  const ev=planTimeline(),total=ev.filter(x=>x.who==='p').length;
  p.actionsLeft=0;p.execP=pool();render();await sleep(250);   // 耐久(2)・魔力(4)の目は、実行を押した時点の出目で決まる
  await roleTurnEnd();
  rec(`【行動順】${ev.map(x=>x.who==='e'?`敵(${x.spd})`:`${ALL[x.id].name}(${x.spd})`).join(' → ')}`,'act');
  let n=0;
  for(const x of ev){
    if(x.who==='p'){
      n++;await doAction(x.q,n,total);
      p.currentSkill=null;
      if(e.hp<=0){endTurnCd();await win();return}
    }else{
      await enemyTurn();
      if(p.hp<=0){await lose();return}
      if(e.hp<=0){endTurnCd();await win();return}
    }
  }
  await pstRoundEnd();   // 毒のダメージ／スタン・弱体・沈黙を、次のラウンドへ
  if(p.hp<=0){await lose();return}
  if(has('regen')&&p.hp<p.maxHp){const h=Math.max(1,R(p.maxHp*.03));p.hp=Math.min(p.maxHp,p.hp+h);popup('pl','+'+h,'heal')}
  p.shield=0;
  endTurnCd();
  await startTurn();
  busy=false;render();
}

/* ===== 味方がかかる状態異常 =====
   敵の攻撃で「HPにダメージが入ったとき」に、その攻撃に設定された状態異常（enemies.js の pat の st）がかかることがある。
   シールドやバリアで完全に防いだときは、かからない。かかる確率は CFG.pstChance（ボスは pstChanceBoss）で、
   2の目（耐久）の個数が多いほど、かかりにくくなる。戦闘が終わると、すべて消える。
     🧪毒 …… 3ターン、ラウンドの終わりに、最大HPの CFG.pstPoisonPct のダメージ
     💫スタン …… 次のラウンド、行動回数が1回減る
     🥀弱体 …… 次のラウンド、与えるダメージが CFG.pstWeakMul 倍
     🔇沈黙 …… 次のラウンド、魔法が使えない
   p.st … いま効いている状態／ p.stNext … 敵の行動で受けた、次のラウンドから効く状態 */
const PST={poison:{name:'毒',icon:'🧪'},stun:{name:'スタン',icon:'💫'},weak:{name:'弱体',icon:'🥀'},silence:{name:'沈黙',icon:'🔇'}};
const newPst=()=>({poison:null,stun:0,weak:0,silence:0});
const newPstNext=()=>({stun:0,weak:0,silence:0});
function pstReset(){p.st=newPst();p.stNext=newPstNext()}
const pstChance=a=>Math.min(0.95,(a.stc!==undefined?a.stc:(e.boss?CFG.pstChanceBoss:CFG.pstChance))*roleStatusResistMul(p.execP||pool()));

// 敵の攻撃でHPにダメージが入ったあとに呼ぶ
function pstTry(a){
  if(!a||!a.st||!PST[a.st])return;
  const c=pstChance(a);
  if(!(Math.random()<c)){rec(`　${PST[a.st].name}は、かからなかった`,'take');return}
  pstInflict(a.st);
}
function pstInflict(kind){
  if(kind==='poison')p.st.poison={pct:CFG.pstPoisonPct,t:3};
  else p.stNext[kind]=1;
  const txt=kind==='poison'?`（ラウンドの終わりに、最大HPの${fmtM(+(CFG.pstPoisonPct*100).toFixed(1))}%）`:'（次のラウンド）';
  rec(`　${PST[kind].icon}${PST[kind].name}を受けた`,'take');log(`${PST[kind].icon}${PST[kind].name}を受けた！${txt}`,true);popup('pl',PST[kind].name,'hurt');
}
// ラウンドの終わり：毒のダメージ → 「次のラウンドから効く状態」を「いま効いている状態」に入れ替える
async function pstRoundEnd(){
  const st=p.st;
  if(st.poison){
    const d=Math.max(1,R(p.maxHp*st.poison.pct));p.hp=Math.max(0,p.hp-d);st.poison.t--;if(st.poison.t<=0)st.poison=null;
    rec(`【毒】勇者に毒ダメージ${fmt(d)}`,'take');log(`毒で${fmt(d)}のダメージ！`,true);popup('pl','-'+fmt(d),'hurt');render();await sleep(350);
  }
  st.stun=p.stNext.stun;st.weak=p.stNext.weak;st.silence=p.stNext.silence;p.stNext=newPstNext();
}
function pstChips(){
  if(!p||!p.st)return '';
  const out=[],st=p.st,nx=p.stNext||{};
  if(st.poison)out.push(`${PST.poison.icon}毒 ${fmtM(+(st.poison.pct*100).toFixed(1))}%×${st.poison.t}`);
  if(st.stun)out.push(`${PST.stun.icon}スタン（行動-1）`);
  if(st.weak)out.push(`${PST.weak.icon}弱体（ダメージ×${CFG.pstWeakMul}）`);
  if(st.silence)out.push(`${PST.silence.icon}沈黙（魔法不可）`);
  for(const k of ['stun','weak','silence'])if(nx[k])out.push(`次：${PST[k].icon}${PST[k].name}`);
  return out.map(t=>`<span class="chip">${t}</span>`).join('');
}

/* ===== 装備のしくみ =====
   装備の名前・価格・説明・数値は data/equipment.xlsx、効果のプログラムは js/equipment_fx.js。
   ここには、枠・装着・発動順・ダメージ計算の流れ（装備が上から順に発動する処理）が入っている。 */
/* ===== 装備：出目に反応して、上から順に発動する ===== */
const SLOT_NAME={weapon:'武器',armor:'防具',acc:'アクセ'};
const SLOT_ORDER=['weapon','armor','acc'];
const SLOT_TYPE={weapon:'武器',armor:'防具',acc:'アクセ'};
const baseSlots=()=>[{t:'weapon',id:null},{t:'armor',id:null},{t:'acc',id:null},{t:'acc',id:null}];
const equipped=()=>p.equip.filter(x=>x.id).map(x=>ITEM_BY[x.id]);
const ownedItem=id=>p.equip.some(x=>x.id===id);
function growSlots(){
  for(const t of SLOT_ORDER)p.equip.push({t,id:null});   // 増えた枠は一番下に追加（並び替えは自由）
}
function moveSlot(code){
  const [i,dir]=String(code).split(':');const k=+i,j=dir==='up'?k-1:k+1;
  if(!(k>=0&&k<p.equip.length)||j<0||j>=p.equip.length)return false;
  const a=p.equip[k],b=p.equip[j];
  p.equip[k]=b;p.equip[j]=a;
  rec(`【装備の並び替え】${a.id?ITEM_BY[a.id].name:'空き枠'}を${dir==='up'?'上':'下'}へ移動`,'s');
  return true;
}
const itemOpt=it=>({id:'i_'+it.id,name:it.name,tag:`装備・${SLOT_TYPE[it.slot]}${it.leg?'・伝説':it.rare?'・レア':''}`,desc:it.desc,cls:it.leg?'legend':'',apply:()=>equipItem(it,false)});
const takeMul=()=>equipped().reduce((m,it)=>m*(it.take?it.take():1),1);

function runPipeline(base,P,preview,sk){
  let v=base;const steps=[];
  const skillId=p.currentSkill||'';
  const skillBoost=equipped().reduce((m,it)=>m*((it.skillMul&&it.skillMul[skillId])||1),1);
  if(skillBoost!==1){v=cl(v*skillBoost);steps.push({id:null,name:'スキル強化',msg:skillId,t:`×${skillBoost}`,v:R(v)})}
  for(const it of equipped()){
    if(!it.dmg)continue;
    const r=it.dmg(P);if(!r)continue;
    let t='';
    if(r.add){v=cl(v+r.add);t=`+${fmt(R(r.add))}`}
    if(r.mul){v=cl(v*r.mul);t=`×${fmtM(r.mul)}`}
    if(r.rand){
      const m=preview?(r.rand[0]+r.rand[1])/2:+(r.rand[0]+Math.random()*(r.rand[1]-r.rand[0])).toFixed(1);
      v=cl(v*m);t=`×${m}`;
    }
    steps.push({id:it.id,name:it.name,msg:r.msg,t,v:R(v)});
  }
  const rm=roleAtkMul(P)*(((sk||ALL[skillId])||{}).type==='mag'?roleMagMul(P):1);   // 目の役割：攻撃（6）・魔力（4）
  if(rm!==1){v=cl(v*rm);steps.push({id:null,name:'目の役割',msg:`${roleCnt(P,6)?`${ROLE[6].icon}${roleCnt(P,6)}個`:''}${roleMagMul(P)>1&&((sk||ALL[skillId])||{}).type==='mag'?` ${ROLE[4].icon}${roleCnt(P,4)}個`:''}`.trim(),t:`×${fmtM(rm)}`,v:R(v)})}
  if(p.st&&p.st.weak){v=cl(v*CFG.pstWeakMul);steps.push({id:null,name:'弱体',msg:'🥀弱体中',t:`×${CFG.pstWeakMul}`,v:R(v)})}   // 敵に弱体させられている
  if(has('power')){v=cl(v*1.2);steps.push({id:null,name:'闘志',msg:'',t:'×1.2',v:R(v)})}
  if(p.dbl){v=cl(v*2);steps.push({id:null,name:'ダブルアップ',msg:'',t:'×2',v:R(v)})}
  return {base:R(base),steps,final:Math.max(1,R(cl(v)))};
}
const previewFinal=(base,P,sk)=>runPipeline(base,P,true,sk).final;
function guardFinal(base,P){
  let v=base;const steps=[];
  for(const it of equipped()){
    if(!it.sh)continue;
    const r=it.sh(P);if(!r)continue;
    v=cl(v+r.add);steps.push({id:it.id,name:it.name,msg:r.msg,t:`+${fmt(R(r.add))}`,v:R(v)});
  }
  return {base:R(base),steps,final:Math.max(1,R(v))};
}
async function cascade(res,note){
  const c=$('#casc'),bs=$('#bigscore');
  rec(`　${note||'基本'}＝${res.base}`,'act');
  c.innerHTML=`<div class="cl">${note||'基本'}<em>${fmt(res.base)}</em></div>`;
  bs.textContent=fmt(res.base);retrigger(bs,'pulse');
  await sleep(res.steps.length?240:120);
  for(const s of res.steps){
    p.hot=s.id;render();
    rec(`　${s.name}${s.msg?'（'+s.msg+'）':''} ${s.t} → ${s.v}`,'act');
    c.innerHTML+=`<div class="cl"><b>${s.name}</b> ${s.msg||''} ${s.t}<em>→ ${fmt(s.v)}</em></div>`;
    bs.textContent=fmt(s.v);retrigger(bs,'pulse');
    await sleep(260);
  }
  p.hot=null;render();
  rec(`　▶ 最終値 ${fmt(res.final)}`,'act');
  await sleep(res.steps.length?220:80);
  bs.textContent='';c.innerHTML='';
}
async function turnStartItems(){
  const P=pool();
  for(const it of equipped()){
    if(!it.turn)continue;
    const r=it.turn(P);if(!r)continue;
    p.hot=it.id;
    if(r.shield){const sh=R(r.shield*equipped().reduce((m,x)=>m*(x.shieldMul||1),1));p.shield+=sh;log(`${it.name}：${r.msg} → シールド+${sh}`);popup('pl','+'+sh,'heal')}
    if(r.heal){log(`${it.name}：${r.msg} → HP+${r.heal}`);healP(r.heal)}
    if(r.mp){p.mp=Math.min(p.maxMp,p.mp+r.mp);log(`${it.name}：${r.msg} → MP+${r.mp}`)}

}

async function equipItem(it,paid){
  const mine=p.equip.filter(x=>x.t===it.slot);
  let slot=mine.find(x=>!x.id);
  const half=Math.round(it.price/2);
  if(!slot){
    const opts=mine.map((x,i)=>{const old=ITEM_BY[x.id];return {x,name:`${old.name}と入れ替える`,tag:SLOT_NAME[it.slot]+(mine.length>1?(i+1):''),desc:`${old.desc}（外した装備は${Math.round(old.price/2)}Gで売却）`,cls:old.leg?'legend':''}});
    opts.push({x:null,name:'見送る',tag:'',desc:paid?`${it.name}は買わない（代金は戻る）`:`${it.name}は受け取らない（${half}Gになる）`});
    const o=await pick(`${it.name}を装備する？`,`${it.desc}`,opts);
    if(!o.x){if(!paid){p.gold+=half;log(`${it.name}を見送り、${half}Gを得た。`)}return false}

/* ===== 攻撃時の状態異常 =====
   装備シートの「攻撃時の状態異常」に 毒・火傷・出血・スタン・凍結・弱体・弱点看破 のどれかを書くと、
   その装備を付けているあいだ、攻撃でダメージを与えるたびに敵へ付与する（プログラムの追加は不要）。
   毒・火傷・出血の強さ ＝ 与えたダメージ × 「状態異常の強さ」を、3ターンのあいだ毎ターン与える。
   付与確率が空なら100%。 */
const STATUS_LABEL={poison:'毒',burn:'火傷',bleed:'出血',stun:'スタン',freeze:'凍結',weaken:'弱体',vulnerable:'弱点看破'};
const STATUS_DOT={poison:1,burn:1,bleed:1};
function itemStatusOnHit(dealt,P){
  if(!(dealt>0)||!e||e.hp<=0)return;
  const rs={};
  for(const it of equipped()){
    const k=it.statusOnHit;if(!k)continue;
    const chance=Math.min(1,(it.statusChance===undefined?1:it.statusChance)+(it.statusChance===undefined?0:roleChanceBonus(P||pool())));   // 技巧（5）の目で付与確率アップ
    if(!(Math.random()<chance))continue;
    if(k==='poison'){const pow=it.statusPower===undefined?0.005:it.statusPower;rs.poison=Math.max(rs.poison||0,pow)}   // 毒だけ：敵の最大HPに対する割合（0.01＝1%）
    else if(STATUS_DOT[k]){const pow=it.statusPower===undefined?0.15:it.statusPower;rs[k]=Math.max(rs[k]||0,pow)}   // 火傷・出血：与えたダメージに対する割合
    else rs[k]=true;
    rec(`　${it.name}：攻撃時に${STATUS_LABEL[k]}`,'act');
  }
  if(Object.keys(rs).length)applyStatuses(rs,true,P,dealt);
}

function labelOf(r,P,sk){
  const t=[];
  if(r.dmg)t.push(`ダメージ約${fmt(previewFinal(r.dmg,P,sk))}`);
  if(r.poison)t.push(`毒${fmtM(+(r.poison*100).toFixed(1))}%/ターン`);
  if(r.burn&&r.dmg)t.push(`火傷約${fmt(R(previewFinal(r.dmg,P,sk)*r.burn))}`);
  if(r.bleed&&r.dmg)t.push(`出血約${fmt(R(previewFinal(r.dmg,P,sk)*r.bleed))}×3回`);
  if(r.freeze)t.push(e.boss?'攻撃半減':'凍結');
  if(r.drain)t.push('吸収');
  if(r.heal)t.push(`HP+${fmt(r.heal)}`);
  if(r.shield)t.push(`シールド${fmt(r.isGuard?guardFinal(r.shield,P).final:r.shield)}`);
  if(r.barrier)t.push(`バリア${fmt(r.barrier)}`);
  if(r.hpCost)t.push(`HP-${r.hpCost}`);
  if(r.dbl)t.push('次のダメージ×2');
  if(r.dmg&&roleCritChance(P)>0)t.push(`会心${Math.round(roleCritChance(P)*100)}%`);
  t.push(`速さ${actionSpeed(P)}`);
  return t.join('・');
}

   キーは data/equipment.xlsx の「スキル」シートの ID と対応している。
   使える条件（◯の目が◯個以上）は data/equipment.xlsx の「必要な目」「必要な個数」で決まる（読み込み時に、ここの calc の外側へ自動で付く）。
   ここの ok は、HPが足りるかなど出目以外の条件だけを書く。

 starfall:P=>({ok:true,dmg:dmgOf(P.S*P.mult*3)}),

 weakness:P=>({ok:true,dmg:dmgOf(P.S*P.mult),weaken:true}),
 venomburst:P=>({ok:true,dmg:dmgOf(P.S*P.mult),poison:0.025}),   // 毒：敵の最大HPの2.5%／ターン
 seven:P=>({ok:true,dmg:dmgOf(P.S*7)}),
 oneslash:P=>({ok:true,dmg:dmgOf(P.S*10)}),

/* ===== プロフィール（アカウントの代わり） =====
   この端末のブラウザの中で、名前ごとに「セーブ・自己ベスト・図鑑」を分けて保存する。
   パスワードやサーバーは使わない。別の端末へは「引き継ぎコード」（書き出し／取り込み）で移す。
   ※ ブラウザのデータを消すとプロフィールも消えるので、大事なものは引き継ぎコードで控えておく。 */
const PROFILES_KEY='chiisana-meikyu-profiles-v1';
const LEGACY_KEYS={save:'chiisana-meikyu-dice-save-v4',best:'chiisana-meikyu-dice-best-v1',codex:'chiisana-meikyu-dice-codex-v1'};
const PROFILE_MAX=8,PROFILE_NAME_MAX=12,CODE_PREFIX='MEIKYU1';
let profiles={cur:'',list:[]};          // list: [{id,name,created}]
let SAVE_KEY='',BEST_KEY='',CODEX_KEY='';   // 使用中のプロフィールの保存先（切り替えると変わる）

const profileKey=(kind,id)=>`chiisana-meikyu-${kind}:${id}`;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(_){return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(_){}};
const parseJSON=t=>{try{return t==null?null:JSON.parse(t)}catch(_){return null}};
const escHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 保存と初期化 ---------- */
function profilesSave(){lsSet(PROFILES_KEY,JSON.stringify(profiles))}
function profilesLoad(){
  const d=parseJSON(lsGet(PROFILES_KEY));
  profiles={cur:'',list:[]};
  if(d&&Array.isArray(d.list)){
    for(const x of d.list){
      if(x&&typeof x.id==='string'&&/^[a-z0-9]{3,32}$/.test(x.id)&&typeof x.name==='string'&&!profiles.list.some(p=>p.id===x.id))
        profiles.list.push({id:x.id,name:profileName(x.name)||'プレイヤー',created:Number(x.created)||0});
    }
    if(typeof d.cur==='string')profiles.cur=d.cur;
  }
}
const profileName=raw=>String(raw||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,PROFILE_NAME_MAX);
function uniqueName(name){let n=name,k=2;while(profiles.list.some(p=>p.name===n)){n=name.slice(0,PROFILE_NAME_MAX-4)+'('+k+')';k++}return n}
function createProfile(name){
  const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  profiles.list.push({id,name:uniqueName(profileName(name)||'プレイヤー'),created:Date.now()});
  profilesSave();
  return id;
}
function setProfileKeys(){SAVE_KEY=profileKey('save',profiles.cur);BEST_KEY=profileKey('best',profiles.cur);CODEX_KEY=profileKey('codex',profiles.cur)}
function initProfiles(){
  profilesLoad();
  if(!profiles.list.length){
    // 初めて：プロフィール機能の前に遊んでいた分（あれば）を「プレイヤー1」に引き継ぐ
    const id=createProfile('プレイヤー1');
    for(const [kind,legacy] of Object.entries(LEGACY_KEYS)){const v=lsGet(legacy);if(v!==null)lsSet(profileKey(kind,id),v)}
    profiles.cur=id;
  }
  if(!profiles.list.some(p=>p.id===profiles.cur))profiles.cur=profiles.list[0].id;
  profilesSave();setProfileKeys();
}
initProfiles();

const curProfile=()=>profiles.list.find(p=>p.id===profiles.cur);
// 切り替えたあと、ゲーム側に残っている「前のプロフィールの状態」を捨てて読み直す
function reloadRuntimeState(){
  p=null;bestCache=loadBest();
  codex=loadCodex();codexRebuild();
}
function switchProfile(id){
  if(!profiles.list.some(x=>x.id===id))return;
  profiles.cur=id;profilesSave();setProfileKeys();reloadRuntimeState();
}
function deleteProfile(id){
  if(profiles.list.length<=1)return;
  for(const kind of ['save','best','codex'])lsDel(profileKey(kind,id));
  profiles.list=profiles.list.filter(x=>x.id!==id);
  if(profiles.cur===id){profiles.cur=profiles.list[0].id;setProfileKeys();reloadRuntimeState()}
  profilesSave();
}
function profileSummary(id){
  const best=parseJSON(lsGet(profileKey('best',id)));
  const cx=parseJSON(lsGet(profileKey('codex',id)));
  const items=cx&&cx.own&&Array.isArray(cx.own.items)?cx.own.items.filter(k=>ITEM_BY[k]).length:0;
  const sv=parseJSON(lsGet(profileKey('save',id)));
  const hasSave=!!(sv&&sv.v===4&&sv.p&&Number.isFinite(sv.next));
  return `${best&&Number.isFinite(best.floor)&&best.floor?`最高 地下${best.floor}階`:'まだ冒険していない'} ／ 装備 ${items}/${ITEMS.length}${hasSave?` ／ セーブ：地下${Math.max(1,Math.floor(sv.next))+1}階`:''}`;
}

/* ---------- 引き継ぎコード ---------- */
function toB64(str){
  const bytes=new TextEncoder().encode(str);let bin='';
  for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin);
}
function fromB64(b64){
  const bin=atob(b64);
  return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
}
function hash32(str){let h=0x811c9dc5;for(const b of new TextEncoder().encode(str)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
function exportProfile(id){
  const pr=profiles.list.find(x=>x.id===id);
  const json=JSON.stringify({app:'chiisana-meikyu-dice',v:1,name:pr.name,
    save:parseJSON(lsGet(profileKey('save',id))),best:parseJSON(lsGet(profileKey('best',id))),codex:parseJSON(lsGet(profileKey('codex',id)))});
  return `${CODE_PREFIX}.${toB64(json)}.${hash32(json)}`;
}
function cleanCodex(c){
  const out=codexEmpty();
  if(!c||!c.own||!c.seen)return out;
  for(const k of CODEX_KINDS)for(const w of ['own','seen']){
    const a=c[w]&&c[w][k];
    if(Array.isArray(a))out[w][k]=[...new Set(a.filter(x=>typeof x==='string'&&x.length<=64))].slice(0,1000);
  }
  return out;
}
// 取り込むと「新しいプロフィール」ができる（いまのプロフィールは上書きしない）
function importProfile(text){
  const t=String(text||'').replace(/\s+/g,'');
  if(t.length>300000)return {error:'コードが長すぎます。'};
  const m=t.match(new RegExp(`^${CODE_PREFIX}\\.([A-Za-z0-9+/=]+)\\.([0-9a-f]{8})$`));
  if(!m)return {error:`コードの形式が違います。「${CODE_PREFIX}.」で始まるコード全体を貼り付けてください。`};
  let json;try{json=fromB64(m[1])}catch(_){return {error:'コードを読み取れませんでした。'}}
  if(hash32(json)!==m[2])return {error:'コードが途中で切れているか、書き換えられています。'};
  const d=parseJSON(json);
  if(!d||d.app!=='chiisana-meikyu-dice'||d.v!==1)return {error:'このゲームのコードではありません。'};
  if(profiles.list.length>=PROFILE_MAX)return {error:`プロフィールは${PROFILE_MAX}個までです。いらないものを削除してから取り込んでください。`};
  const id=createProfile(profileName(d.name)||'ひきつぎ');
  const sv=d.save,bs=d.best;
  if(sv&&sv.v===4&&sv.p&&typeof sv.p==='object'&&Number.isFinite(sv.next))lsSet(profileKey('save',id),JSON.stringify(sv));
  if(bs&&Number.isFinite(bs.floor)&&Number.isFinite(bs.maxHit))lsSet(profileKey('best',id),JSON.stringify({floor:bs.floor,maxHit:bs.maxHit}));
  lsSet(profileKey('codex',id),JSON.stringify(cleanCodex(d.codex)));
  return {id,name:profiles.list.find(x=>x.id===id).name};
}

/* ---------- 画面 ---------- */
let pfArmed='';   // 削除の確認中のプロフィールID
const pfBtn=(act,label,id,extra='')=>`<button class="sbtn" data-act="${act}"${id?` data-id="${id}"`:''} ${extra}>${label}</button>`;
const pfWide=(act,label,go)=>`<button class="card${go?' go':''}" data-act="${act}"><span class="ct" style="justify-content:center"><b>${label}</b></span></button>`;
function pfLeave(){$('#ovB').onclick=null;pfArmed='';titleScreen()}

function showProfiles(msg){
  const rows=profiles.list.map(x=>{
    const cur=x.id===profiles.cur,armed=pfArmed===x.id;
    return `<div class="card cdx ${cur?'own':''}"><span class="ct"><b>${escHtml(x.name)}</b><em>${cur?'使用中':''}</em></span><span class="cd">${escHtml(profileSummary(x.id))}</span>`+
      `<span class="pfbtns">${cur?'':pfBtn('use','このプロフィールで遊ぶ',x.id)}${pfBtn('rename','名前を変える',x.id)}${pfBtn('export','引き継ぎコード',x.id)}`+
      `${profiles.list.length>1?pfBtn('del',armed?'本当に削除する？':'削除',x.id):''}</span></div>`;
  }).join('');
  showOv('プロフィール',(msg?`<span class="pfmsg">${escHtml(msg)}</span><br>`:'')+'<span class="cdnote">セーブ・自己ベスト・図鑑は、プロフィールごとに別々に保存されます。パスワードはなく、このブラウザの中だけに保存されます。</span>',
    rows+(profiles.list.length<PROFILE_MAX?pfWide('new','＋ 新しいプロフィール'):'')+pfWide('import','引き継ぎコードを取り込む')+pfWide('back','戻る',true));
  $('#ovB').onclick=ev=>{
    const b=ev.target.closest('button[data-act]');if(!b)return;
    const act=b.dataset.act,id=b.dataset.id;
    if(act!=='del')pfArmed='';
    if(act==='back')return pfLeave();
    if(act==='use'){switchProfile(id);return pfLeave()}
    if(act==='new')return showProfileForm('new');
    if(act==='rename')return showProfileForm('rename',id);
    if(act==='export')return showExport(id);
    if(act==='import')return showImport();
    if(act==='del'){
      if(pfArmed!==id){pfArmed=id;return showProfiles()}
      const name=profiles.list.find(x=>x.id===id).name;pfArmed='';deleteProfile(id);return showProfiles(`「${name}」を削除しました。`);
    }
  };
}
function showProfileForm(mode,id){
  const pr=id&&profiles.list.find(x=>x.id===id);
  showOv(mode==='new'?'新しいプロフィール':'名前を変える',`<span class="cdnote">名前は${PROFILE_NAME_MAX}文字までです。</span>`,
    `<input class="pfin" id="pfName" maxlength="${PROFILE_NAME_MAX}" placeholder="名前" value="${pr?escHtml(pr.name):''}" autocomplete="off"><span class="pfmsg" id="pfErr"></span>`+
    pfWide('ok',mode==='new'?'作る':'変更する',true)+pfWide('cancel','やめる'));
  const input=$('#pfName');input.focus();input.select();
  const submit=()=>{
    const name=profileName(input.value);
    if(!name){$('#pfErr').textContent='名前を入力してください。';return}
    if(profiles.list.some(x=>x.name===name&&x.id!==id)){$('#pfErr').textContent='同じ名前のプロフィールがあります。';return}
    if(mode==='new'){
      if(profiles.list.length>=PROFILE_MAX)return showProfiles(`プロフィールは${PROFILE_MAX}個までです。`);
      const nid=createProfile(name);switchProfile(nid);return pfLeave();   // 作ったらそのまま使う
    }
    pr.name=name;profilesSave();showProfiles('名前を変更しました。');
  };
  input.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();submit()}};
  $('#ovB').onclick=ev=>{
    const b=ev.target.closest('button[data-act]');if(!b)return;
    if(b.dataset.act==='ok')submit();else showProfiles();
  };
}
function showExport(id){
  const pr=profiles.list.find(x=>x.id===id),code=exportProfile(id);
  showOv('引き継ぎコード',`<span class="cdnote">「${escHtml(pr.name)}」のセーブ・自己ベスト・図鑑が入っています。別の端末の「引き継ぎコードを取り込む」に貼り付けると、新しいプロフィールとして復元されます。パスワードはないので、コードは人に見せないでください。</span>`,
    `<textarea class="pfin" id="pfCode" rows="6" readonly>${code}</textarea><span class="pfmsg" id="pfErr"></span>`+
    pfWide('copy','コピーする')+pfWide('file','ファイルに保存する')+pfWide('cancel','戻る',true));
  const area=$('#pfCode');area.onclick=()=>area.select();
  $('#ovB').onclick=async ev=>{
    const b=ev.target.closest('button[data-act]');if(!b)return;
    const act=b.dataset.act;
    if(act==='cancel')return showProfiles();
    if(act==='copy'){
      try{await navigator.clipboard.writeText(code);$('#pfErr').textContent='コピーしました。'}
      catch(_){area.select();$('#pfErr').textContent='自動でコピーできませんでした。選択されたコードを、手動でコピーしてください。'}
    }
    if(act==='file'){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download='chiisana-meikyu-save.txt';
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      $('#pfErr').textContent='保存しました（ダウンロードフォルダを確認してください）。';
    }
  };
}
function showImport(){
  showOv('引き継ぎコードを取り込む','<span class="cdnote">書き出したコードを貼り付けるか、保存したファイルを選んでください。新しいプロフィールとして取り込まれ、いまのプロフィールは変わりません。</span>',
    `<textarea class="pfin" id="pfCode" rows="6" placeholder="${CODE_PREFIX}.…"></textarea><input type="file" id="pfFile" accept=".txt,text/plain" class="pfin"><span class="pfmsg" id="pfErr"></span>`+
    pfWide('ok','取り込む',true)+pfWide('cancel','やめる'));
  const area=$('#pfCode');
  $('#pfFile').onchange=async ev=>{const f=ev.target.files[0];if(f)area.value=(await f.text()).slice(0,300000)};
  $('#ovB').onclick=ev=>{
    const b=ev.target.closest('button[data-act]');if(!b)return;
    if(b.dataset.act==='cancel')return showProfiles();
    if(b.dataset.act==='ok'){
      const r=importProfile(area.value);
      if(r.error){$('#pfErr').textContent=r.error;return}
      showProfiles(`「${r.name}」を取り込みました。使うには「このプロフィールで遊ぶ」を押してください。`);
    }
  };
}

/* ===== 図鑑（見つけた装備・ダイス・スキルをこの端末に記録。やられても消えない） ===== */
const CODEX_KINDS=['items','dice','skills','status'];
const codexEmpty=()=>({own:{items:[],dice:[],skills:[],status:[]},seen:{items:[],dice:[],skills:[],status:[]}});
function loadCodex(){
  const c=codexEmpty();
  try{
    const d=JSON.parse(localStorage.getItem(CODEX_KEY)||'null');
    if(d&&d.own&&d.seen)for(const k of CODEX_KINDS)for(const w of ['own','seen']){
      if(Array.isArray(d[w][k]))c[w][k]=d[w][k].filter(x=>typeof x==='string');
    }
  }catch(_){}
  return c;
}
let codex=loadCodex();
const codexSets={own:{},seen:{}};
function codexRebuild(){for(const w of ['own','seen']){codexSets[w]={};for(const k of CODEX_KINDS)codexSets[w][k]=new Set(codex[w][k])}}
codexRebuild();
function codexSave(){try{localStorage.setItem(CODEX_KEY,JSON.stringify(codex))}catch(_){}}
// which: 'own'（手に入れた）/ 'seen'（見かけた）。手に入れたものは見かけたことにもなる
function codexAdd(which,kind,ids){
  let ch=false;
  for(const id of ids){
    if(!id||typeof id!=='string')continue;
    if(!codexSets[which][kind].has(id)){codexSets[which][kind].add(id);codex[which][kind].push(id);ch=true}
    if(which==='own'&&!codexSets.seen[kind].has(id)){codexSets.seen[kind].add(id);codex.seen[kind].push(id);ch=true}
  }
  if(ch)codexSave();
  return ch;
}
function codexStatus(k){codexAdd('own','status',[k])}
function codexSync(){
  if(!p)return;
  codexAdd('own','items',p.equip.map(x=>x.id));
  codexAdd('own','dice',p.slots);
  codexAdd('own','skills',p.skills);
}
// 選択肢に付けるしるし。'new'＝図鑑にまだ載っていない初登場／'un'＝見たことはあるが一度も手に入れていない。記録する前に判定する
function codexMark(list){
  for(const o of list||[]){
    const id=o&&typeof o.id==='string'?o.id:'';
    let kind='',key='';
    if(id.startsWith('i_')&&ITEM_BY[id.slice(2)]){kind='items';key=id.slice(2)}
    else if(id.startsWith('d_')&&DICE_T[id.slice(2)]){kind='dice';key=id.slice(2)}
    else if(id.startsWith('s_')&&SKILLS.some(s=>s.id===id.slice(2))){kind='skills';key=id.slice(2)}
    if(!kind)continue;
    o.mark=!codexSets.seen[kind].has(key)?'new':!codexSets.own[kind].has(key)?'un':'';
  }
}
const markHTML=o=>o&&o.mark==='new'?'<span class="nw">NEW</span>':o&&o.mark==='un'?'<span class="nw un">未入手</span>':'';
function codexSee(list){
  codexMark(list);
  const add={items:[],dice:[],skills:[],status:[]};
  for(const o of list||[]){
    const id=o&&typeof o.id==='string'?o.id:'';
    if(id.startsWith('i_')&&ITEM_BY[id.slice(2)])add.items.push(id.slice(2));
    else if(id.startsWith('d_')&&DICE_T[id.slice(2)])add.dice.push(id.slice(2));
    else if(id.startsWith('s_')&&SKILLS.some(s=>s.id===id.slice(2)))add.skills.push(id.slice(2));
  }
  for(const k of CODEX_KINDS)if(add[k]&&add[k].length)codexAdd('seen',k,add[k]);
}
const STATUS_FX=[
 {id:'poison',name:'毒',desc:'重ねがけするほど強くなる。毎ターン、敵の最大HPの一定割合のダメージ（上限あり）。ボス戦向け。「猛毒の牙」で2倍。',via:['venom','venomburst']},
 {id:'burn',name:'火傷',desc:'付与した瞬間に1回分のダメージが入り、そのあと2ターン続く。',via:['flare']},
 {id:'bleed',name:'出血',desc:'敵がダメージを受けるたびに、追加ダメージが入る（3回分）。',via:['rupture']},
 {id:'stun',name:'スタン',desc:'通常の敵の次の行動を1回止める。ボスには効かず、代わりに次の攻撃が弱体化する。',via:['stunstrike']},
 {id:'freeze',name:'凍結',desc:'敵の次の行動を飛ばす（1戦闘に1回まで）。ボスは凍らず、次の攻撃が弱体化する。「氷牙」で凍結中の敵へのダメージが2倍。',via:['ice','timebreak']},
 {id:'weak',name:'弱体',desc:'敵の次の攻撃のダメージが半分になる。',via:['weakness']},
 {id:'vulnerable',name:'弱点看破',desc:'次に受けるダメージが1.5倍になる（1回）。',via:['expose']},
];
function codexRows(kind){
  if(kind==='status')return STATUS_FX.map(f=>({id:f.id,name:f.name,tag:'状態異常',slotTag:'',desc:f.desc+'　付与：'+f.via.map(id=>(SKILLS.find(s=>s.id===id)||{name:id}).name).concat(ITEMS.filter(it=>it.statusOnHit===(f.id==='weak'?'weaken':f.id)).map(it=>it.name+'（装備）')).join('・'),cls:''}));
  if(kind==='items')return ITEMS.slice().sort((a,b)=>(a.leg?1:0)-(b.leg?1:0)||a.price-b.price).map(it=>({id:it.id,name:it.name,tag:SLOT_TYPE[it.slot]+(it.leg?'・伝説':it.rare?'・レア':''),slotTag:SLOT_TYPE[it.slot],desc:it.desc,cls:it.leg?'legend':'',slot:it.slot}));
  if(kind==='dice')return Object.keys(DICE_T).map(k=>({id:k,name:DICE_T[k].name,tag:'ダイス',slotTag:'',desc:DICE_T[k].desc,cls:''}));
  return SKILLS.map(s=>({id:s.id,name:s.name,tag:s.type==='atk'?'スキル':`魔法・MP${s.mp}`,slotTag:'',desc:skDesc(s),cls:''}));
}
const codexCount=k=>codexRows(k).filter(r=>codexSets.own[k].has(r.id)).length;
let codexTab='items',codexArmed=false;
function codexCard(r,kind){
  const st=codexSets.own[kind].has(r.id)?'own':codexSets.seen[kind].has(r.id)?'seen':'unk';
  if(st==='unk')return `<div class="card cdx unk"><span class="ct"><b>？？？</b><em>${r.slotTag}</em></span><span class="cd">まだ見つけていない</span></div>`;
  return `<div class="card cdx ${st} ${r.cls}"><span class="ct"><b>${r.name}</b><em>${r.tag}・${st==='own'?(kind==='status'?'確認済み':'入手済み'):'見かけた'}</em></span><span class="cd">${r.desc}</span></div>`;
}
function showCodex(){
  const kind=codexTab,rows=codexRows(kind);
  const tabs=[['items','装備'],['dice','ダイス'],['skills','スキル'],['status','状態異常']].map(([k,n])=>
    `<button class="cdtab ${k===kind?'on':''}" data-t="${k}">${n}<br><small>${codexCount(k)}/${codexRows(k).length}</small></button>`).join('');
  let list='';
  if(kind==='items'){
    for(const sl of ['weapon','armor','acc']){
      const rs=rows.filter(r=>r.slot===sl);
      list+=`<div class="cdh">${SLOT_TYPE[sl]}　${rs.filter(r=>codexSets.own.items.has(r.id)).length}/${rs.length}</div>`+rs.map(r=>codexCard(r,kind)).join('');
    }
  }else list=rows.map(r=>codexCard(r,kind)).join('');
  showOv('図鑑','<span class="cdnote">見つけたもの・体験した状態異常がこの端末に記録されます。やられても消えません。</span>',
    `<div class="cdtabs">${tabs}</div>${list}`+
    `<button class="card go" id="cdBack"><span class="ct" style="justify-content:center"><b>戻る</b></span></button>`+
    `<button class="card" id="cdReset"><span class="ct" style="justify-content:center"><b id="cdResetT">${codexArmed?'本当に消す？（もう一度押すと消えます）':'図鑑をリセット'}</b></span></button>`);
  $('#ovB').onclick=ev=>{
    const t=ev.target.closest('button[data-t]');
    if(t){codexTab=t.dataset.t;codexArmed=false;showCodex();$('#ov').scrollTop=0;return}
    if(ev.target.closest('#cdBack')){$('#ovB').onclick=null;codexArmed=false;titleScreen();return}
    if(ev.target.closest('#cdReset')){
      if(!codexArmed){codexArmed=true;showCodex();return}
      codexArmed=false;codex=codexEmpty();codexRebuild();codexSave();showCodex();
    }
  };
}

/* ===== データ表（Excel）の読み込みと組み立て =====
   data/equipment.xlsx（装備・スキル・ダイス）を読み、効果のプログラム（ITEM_FX・SKILL_FX）とくっつけて
   ゲームで使う ITEMS / SKILLS / DICE_T を作る。列は「1行目の見出しの名前」で判別するので、列の順番は変えてもよい。 */
const DATA_FILE='data/equipment.xlsx';
let ITEMS=[],ITEM_BY={},SKILLS=[],SKILL_BY={},ALL={},DICE_T={};
const DATA_WARNINGS=[];

const ITEM_PARAM_COLS={   // Excelの見出し → ゲーム内の項目名
  '出目の合計×':'sumMul','揃いボーナス2乗':'matchPow','行動回数+':'actions','勝利時MP+':'onWinMp','勝利ゴールド×':'goldMul',
  '致死耐え回数':'undying','待機ターン短縮':'cooldownReduce','戦闘中ダイス+':'battleDice','MP消費軽減':'mpDiscount',
  'シールド×':'shieldMul','回避率(0〜1)':'dodge','毒ダメージ×':'poisonMul','反射ダメージ×':'refMul','スキル威力×(例 meteor:2)':'skillMul',
  '行動の速さ+':'speedBonus','攻撃時の状態異常':'statusOnHit','状態異常の強さ(与ダメ×)':'statusPower','付与確率(0〜1)':'statusChance',
};
const STATUS_FROM_JP={'毒':'poison','火傷':'burn','出血':'bleed','スタン':'stun','凍結':'freeze','弱体':'weaken','弱点看破':'vulnerable'};
const SLOT_FROM_JP={'武器':'weapon','防具':'armor','アクセ':'acc','アクセサリー':'acc','weapon':'weapon','armor':'armor','acc':'acc'};
const TYPE_FROM_JP={'スキル':'atk','攻撃':'atk','atk':'atk','魔法':'mag','まほう':'mag','mag':'mag'};

const warn=msg=>{DATA_WARNINGS.push(msg);console.warn('[データ表] '+msg)};
const blank=v=>v===undefined||v===null||(typeof v==='string'&&v.trim()==='');
const str=v=>blank(v)?'':String(v).trim();
const num=v=>{if(blank(v))return undefined;const n=Number(v);return Number.isFinite(n)?n:undefined};
const truthy=v=>v===true||(!blank(v)&&/^(○|〇|◯|1|true|yes|y|はい)$/i.test(String(v).trim()));

// シートを「見出し名→値」の行リストにする（IDが空の行は無視）
function sheetRows(T,name){
  const rows=T[name];
  if(!rows||!rows.length)throw new Error(`シート「${name}」が見つかりません`);
  const head=(rows[0]||[]).map(h=>blank(h)?'':String(h).trim());
  const out=[];
  rows.slice(1).forEach((r,i)=>{
    const o={_row:i+2};
    head.forEach((h,c)=>{if(h&&!blank(r[c]))o[h]=r[c]});
    if(!blank(o['ID']))out.push(o);
  });
  return out;
}
function parseFaces(v,where){
  const out=[];
  for(const tok of String(v==null?'':v).split(/[,\s、，]+/).filter(Boolean)){
    const m=tok.match(/^(\d+)[-〜~](\d+)$/);
    if(m){for(let n=+m[1];n<=+m[2];n++)out.push(n)}
    else if(/^\d+$/.test(tok))out.push(+tok);
    else warn(`${where}：出る目「${tok}」は数字ではありません`);
  }
  return out;
}
function parseSkillMul(v,where){
  const o={};
  for(const tok of String(v).split(/[,\s、，]+/).filter(Boolean)){
    const m=tok.match(/^([A-Za-z0-9_]+)[:：]([0-9.]+)$/);
    if(m)o[m[1]]=+m[2];else warn(`${where}：スキル威力「${tok}」は「スキルID:倍率」の形で書いてください`);
  }
  return Object.keys(o).length?o:undefined;
}

// 効果プログラム calc の外側に「◯の目が◯個以上」の条件をかぶせる
function withFaceNeed(calc,face,count,ratio){
  return P=>{
    const r=calc(P),c=P.cnt[face]||0;
    const need=ratio?Math.max(count,Math.ceil(P.N*ratio-1e-9)):count;   // 割合ありなら、ダイス数に応じて必要な個数が変わる
    return c<need?Object.assign({},r,{ok:false,needText:`${face}の目が${need}個以上必要（${ratio?`ダイスの${Math.round(ratio*100)}%・`:''}いま${c}個）`}):r;
  };
}
function buildData(T){
  DATA_WARNINGS.length=0;
  // --- ダイス
  const dice={},seen=new Set();
  for(const r of sheetRows(T,'ダイス')){
    const id=str(r['ID']),where=`ダイス ${r._row}行目(${id})`;
    if(seen.has(id)){warn(`${where}：IDが重複しています（無視）`);continue}
    seen.add(id);
    const faces=parseFaces(r['出る目(カンマ区切り)'],where);
    if(!faces.length){warn(`${where}：出る目が空のため無視します`);continue}
    dice[id]={name:str(r['名前'])||id,tag:str(r['表示']),faces,price:num(r['価格'])||0,desc:str(r['説明'])};
  }
  if(!dice.normal)throw new Error('ダイスシートに「normal」（ふつうのダイス）が必要です');
  // --- 装備
  const items=[];seen.clear();
  for(const r of sheetRows(T,'装備')){
    const id=str(r['ID']),where=`装備 ${r._row}行目(${id})`;
    if(seen.has(id)){warn(`${where}：IDが重複しています（無視）`);continue}
    seen.add(id);
    const slot=SLOT_FROM_JP[str(r['枠'])];
    if(!slot){warn(`${where}：枠「${str(r['枠'])}」は 武器／防具／アクセ のどれかにしてください（無視）`);continue}
    const it={id,slot,name:str(r['名前'])||id,price:num(r['価格'])||0,desc:str(r['説明'])};
    const rar=str(r['レア度']);
    if(rar==='レア')it.rare=true;else if(rar==='伝説')it.leg=true;else if(rar&&rar!=='通常')warn(`${where}：レア度「${rar}」は 通常／レア／伝説 のどれかにしてください`);
    for(const [col,key] of Object.entries(ITEM_PARAM_COLS)){
      const v=r[col];if(blank(v))continue;
      if(key==='matchPow'){if(truthy(v))it.matchPow=true}
      else if(key==='skillMul'){const m=parseSkillMul(v,where);if(m)it.skillMul=m}
      else if(key==='statusOnHit'){const k=STATUS_FROM_JP[str(v)];if(k)it.statusOnHit=k;else warn(`${where}：状態異常「${str(v)}」は 毒／火傷／出血／スタン／凍結／弱体／弱点看破 のどれかにしてください`)}
      else if(key==='statusChance'){const n=num(v);if(n===undefined||n<0)warn(`${where}：「${col}」は0〜1の数字にしてください`);else it.statusChance=n>1?n/100:n}
      else{const n=num(v);if(n===undefined)warn(`${where}：「${col}」は数字にしてください`);else it[key]=n}
    }
    items.push(Object.assign(it,ITEM_FX[id]||{}));
  }
  const stopped=new Set(T['停止中の装備']?sheetRows(T,'停止中の装備').map(r=>str(r['ID'])):[]);   // 一時的に外した装備（装備シートへ戻せば復活）
  for(const id of Object.keys(ITEM_FX))if(!seen.has(id)&&!stopped.has(id))warn(`装備の効果「${id}」に対応する行が、装備シートにありません`);
  if(!items.length)throw new Error('装備シートにデータがありません');
  // --- スキル
  const skills=[];seen.clear();
  for(const r of sheetRows(T,'スキル')){
    const id=str(r['ID']),where=`スキル ${r._row}行目(${id})`;
    if(seen.has(id)){warn(`${where}：IDが重複しています（無視）`);continue}
    seen.add(id);
    const type=TYPE_FROM_JP[str(r['種別'])];
    if(!type){warn(`${where}：種別「${str(r['種別'])}」は スキル／魔法 のどちらかにしてください（無視）`);continue}
    const calc=SKILL_FX[id];
    if(!calc){warn(`${where}：効果のプログラムがないため、このスキルは使えません（無視）`);continue}
    const s={id,type,name:str(r['名前'])||id,desc:str(r['説明'])};
    const mp=num(r['MP']);if(mp!==undefined)s.mp=mp;
    if(!blank(r['必要条件(使えない時の表示)']))s.need=str(r['必要条件(使えない時の表示)']);
    s.cd=num(r['待機ターン'])||0;
    // 使える条件：「◯の目が◯個以上」（出目以外の条件は、効果プログラム側の ok で判定する）
    //   「必要な個数」だけ ＝ その個数以上。「必要な割合」も書くと ＝ ダイス数×割合（切り上げ）以上で、かつ「必要な個数」を最低ラインにする
    const nf=num(r['必要な目']),nc=num(r['必要な個数']);let nr=num(r['必要な割合(ダイス数×)']);
    if(nr!==undefined&&nr>1)nr=nr/100;   // 50 と書かれても 50% として扱う
    if(nf!==undefined||nc!==undefined||nr!==undefined){
      if(nf===undefined||!Number.isInteger(nf)||nf<1)warn(`${where}：「必要な目」は1以上の整数にしてください（条件なしになります）`);
      else if(nc!==undefined&&(!Number.isInteger(nc)||nc<1))warn(`${where}：「必要な個数」は1以上の整数にしてください（条件なしになります）`);
      else if(nr!==undefined&&!(nr>0&&nr<=1))warn(`${where}：「必要な割合」は0より大きく100%以下にしてください（条件なしになります）`);
      else{s.needFace=nf;s.needCount=nc===undefined?1:nc;if(nr!==undefined)s.needRatio=nr}
    }
    s.calc=s.needFace?withFaceNeed(calc,s.needFace,s.needCount,s.needRatio):calc;
    skills.push(s);
  }
  for(const id of Object.keys(SKILL_FX))if(!seen.has(id))warn(`スキルの効果「${id}」に対応する行が、スキルシートにありません`);
  if(!skills.length)throw new Error('スキルシートにデータがありません');
  // --- 目の役割（シートがなければ初期値）
  if(T['目の役割']){
    const roles={},rows=T['目の役割'],head=(rows[0]||[]).map(h=>blank(h)?'':String(h).trim());
    for(const row of rows.slice(1)){
      const o={};head.forEach((h,c)=>{if(h&&!blank(row[c]))o[h]=row[c]});
      const f=num(o['目']);if(f===undefined||!Number.isInteger(f)||f<1)continue;
      const base=ROLE_DEFAULT[f]||{name:'',icon:'',desc:''};
      roles[f]={name:str(o['役割'])||base.name,icon:str(o['アイコン'])||base.icon,desc:str(o['説明'])||base.desc,a:num(o['効果量1'])||0,b:num(o['効果量2'])||0,c:num(o['効果量3'])||0};
    }
    if(Object.keys(roles).length)ROLE=roles;
  }else warn('「目の役割」シートがないため、初期値を使います');
  // 沈黙中は魔法が使えない（敵の状態異常。js/pstatus.js）
  for(const s of skills){
    if(s.type!=='mag')continue;
    const c0=s.calc;
    s.calc=P=>{const r=c0(P);return (typeof p!=='undefined'&&p&&p.st&&p.st.silence)?Object.assign({},r,{ok:false,needText:'沈黙中（魔法が使えない）'}):r};
  }
  // --- 反映
  DICE_T=dice;ITEMS=items;SKILLS=skills;
  ITEM_BY=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
  SKILL_BY=Object.fromEntries(SKILLS.map(s=>[s.id,s]));

function fmt(n){
  if(!Number.isFinite(n))return n>0?'∞':String(n);
  n=Math.round(n);const a=Math.abs(n);
  if(a<10000)return String(n);
  if(a>=1e16){const [m,x]=n.toExponential(2).split('e');return m.replace(/\.?0+$/,'')+'e'+x.replace('+','')}
  for(const [u,sx] of UNITS){if(a>=u){const v=n/u;return (v>=100?String(Math.round(v)):v.toFixed(1).replace(/\.0$/,''))+sx}}
  return String(n);
}
const fmtM=x=>x>=10000?fmt(x):String(+(+x).toFixed(2));

function saveBest(){
  if(!p)return bestCache;
  const b=loadBest();let ch=false;
  if(stage+1>b.floor){b.floor=stage+1;ch=true}
  if((p.maxHit||0)>b.maxHit){b.maxHit=p.maxHit;ch=true}
  bestCache=b;
  if(ch){try{localStorage.setItem(BEST_KEY,JSON.stringify(b))}catch(_){}}
  return b;
}

let canSave=true;

function loadSave(){
  try{
    const t=localStorage.getItem(SAVE_KEY);if(!t)return null;
    const d=JSON.parse(t);
    if(!d||d.v!==4||!d.p||!Number.isFinite(d.next))return null;
    return d;
  }catch(_){return null}
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(_){}}
function persist(next,shopPending,quiet){
  if(next>=FLOORS&&!p.endless)return;
  const q=p;
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({v:4,next,shopPending:!!shopPending,
      p:{hp:q.hp,maxHp:q.maxHp,mp:q.mp,maxMp:q.maxMp,gold:q.gold,skills:q.skills,passives:q.passives,slots:q.slots,equip:q.equip,endless:!!q.endless,maxHit:q.maxHit||0,cds:q.cds||{}}}));
    if(!quiet)log('自動セーブしました。');
  }catch(_){canSave=false}
}

function restoreCds(q){

function restoreEquip(q){

}

// 速さ（1）の目の個数に応じて、振り直し回数と行動回数を決め直す（出目が変わるたびに呼ぶ）
function syncRoleBonuses(){
  if(!p||!p.dice||!p.dice.length)return;
  const P=pool();
  p.actions=p.actionsBase+roleActionBonus(P);p.actionsLeft=Math.max(0,p.actions-p.actionsUsed);
  p.rerolls=Math.max(0,p.rerollsBase+roleRerollBonus(P)-p.rerollsUsed);
}
async function startTurn(){

  p.rerolls=CFG.rerolls+(has('reroll')?1:0);p.rerollsBase=p.rerolls;p.locked=new Set();p.rerollsUsed=0;
  p.dice=[...p.slots,...Array(p.battleDiceBonus||0).fill('normal')].map(t=>({t,v:1}));

  if(g){p.gold+=g;log(`金のダイスが${g}Gを生んだ！`);popup('pl','+'+g+'G','gold')}
  const lucky=p.dice.filter(d=>d.t==='lucky').reduce((a,d)=>a+(d.v===8?2:0),0);
  if(lucky){p.gold+=lucky;log(`幸運ダイスの8がボーナス${lucky}Gを生んだ！`)}

  rec(`【ダイス】${p.slots.length}個を振った → ${tallyText()}`,'roll');
  const spc={};p.slots.forEach(t=>{if(t!=='normal')spc[t]=(spc[t]||0)+1});
  if(Object.keys(spc).length)rec(`　特殊ダイス：${Object.keys(spc).map(t=>DICE_T[t].name+'×'+spc[t]).join('、')}`,'roll');
  const P0=pool();rec(`　合計${P0.S}／最多${P0.M}個／揃い×${P0.mult}${P0.jack?'（ジャックポット）':''}／ペア${P0.pairs}組／最長連続${P0.run}`,'roll');
  log(`出目：${tallyText()}`,true);

  await turnStartItems();

async function reroll(){
  const idx=p.dice.map((d,i)=>p.locked.has(d.v)?-1:i).filter(i=>i>=0);
  if(p.rerolls<=0||!idx.length)return;

async function hit(amount){
  let d=Math.max(1,R(cl(amount)));
  if(e.vulnerable){const vm=e.vulnMul||1.5;d=R(d*vm);e.vulnerable=false;log(`${e.name}の隙を突いた！ダメージ${fmtM(+vm.toFixed(2))}倍！`)}
  if(e.stun>0){d=R(d*CFG.comboStun);log(`💫気絶中の${e.name}に追撃！ダメージ×${CFG.comboStun}`)}   // コンボ：気絶ボーナス
  const big=d>=e.maxHp*.25;
  e.hp=Math.max(0,e.hp-d);
  if(d>(p.maxHit||0)){p.maxHit=d}
  log(`${e.name}に${fmt(d)}のダメージ！`);popup('scene',fmt(d),big?'dmg big':'dmg');shake(big);render();
  await sleep(big?520:380);
  return d;
}
function healP(n){
  const before=p.hp;p.hp=Math.min(p.maxHp,p.hp+n);
  const g=p.hp-before;log(`HPが${g}回復した。`);popup('pl','+'+g,'heal');render();
}
// 敵に状態異常を付ける（スキルの結果 r と、装備の「攻撃時の状態異常」の両方から使う）。keep=true なら、すでにある毒・火傷・出血より弱くならない
// 状態異常を付ける。火傷・出血の強さは「base（その行動が与えたダメージ）× r.burn / r.bleed（割合）」。毒は「敵の最大HP × r.poison（割合）」
// --- 敵の耐性・弱点（enemies.js の res。0＝無効／0.5＝耐性／1.5＝弱点）
const STATUS_NAME={poison:'毒',burn:'火傷',bleed:'出血',stun:'スタン',freeze:'凍結',weaken:'弱体',vulnerable:'弱点看破'};
const resOf=k=>{const v=e.res&&e.res[k];return v===undefined?1:v};
// 状態異常が通るかを調べる。無効なら false。耐性は、かかる／かからないの状態異常（スタン・凍結・弱体・弱点看破）では、確率で防ぐ
function resistCheck(kind){
  const rm=resOf(kind),nm=STATUS_NAME[kind];
  if(rm===0){log(`${e.name}には${nm}が効かない！`,true);rec(`　${nm}：無効`,'act');return false}
  if(rm<1&&['stun','freeze','weaken','vulnerable'].includes(kind)&&!(Math.random()<rm)){log(`${e.name}は${nm}に耐えた！`,true);rec(`　${nm}：耐性で防がれた`,'act');return false}
  return true;
}
const resNote=k=>{const rm=resOf(k);return rm<1&&rm>0?'（耐性で半減）':rm>1?'（弱点！）':''};
function applyStatuses(r,keep,P,base){
  const P2=P||pool(),sm=roleStatusMul(P2),dur=roleStatusDuration(P2),wm=roleWeakMul(P2),vm=roleVulnMul(P2);   // 技巧（5）の目：状態異常が強くなり、毒・火傷・出血は長く続く
  // 毒：敵の最大HPの％を、毎ターン。重ねがけで割合が増える（上限 CFG.poisonCap）。長引く戦い（ボス）向け
  if(r.poison&&resistCheck('poison')){
    const pmul=equipped().reduce((m,it)=>m*(it.poisonMul||1),1),cur=e.poison;
    e.poison={t:Math.max(3+dur,cur?cur.t:0),pct:Math.min(CFG.poisonCap,(cur?cur.pct:0)+r.poison*pmul*sm*resOf('poison'))};
    log(`${e.name}は毒に侵された！（毎ターン最大HPの${fmtM(+(e.poison.pct*100).toFixed(1))}%）${resNote('poison')}`);codexStatus('poison');render();
  }
  // 火傷：付与した瞬間に1回分のダメージが入り、そのあと2ターン続く（武器の連続付与では、火傷が付いていないときだけ即時ダメージ）
  if(r.burn&&resistCheck('burn')){
    const d=Math.max(1,R((base||0)*r.burn*sm*resOf('burn'))),cur=e.burn;
    e.burn={t:2+dur,d:keep&&cur?Math.max(cur.d,d):d};
    if(!keep||!cur){
      const vapor=!!e.frozen,imm=vapor?Math.round(d*CFG.comboVapor):d;   // コンボ：蒸発（凍結中に火傷）
      if(vapor){e.frozen=false;log(`💥蒸発！凍結が解けて、火傷の即時ダメージが×${CFG.comboVapor}！`,true)}
      e.hp=Math.max(0,e.hp-imm);log(`${e.name}は火傷した！即座に${fmt(imm)}のダメージ！${resNote('burn')}`,true);popup('scene',imm,'dmg');rec(`　火傷：即時ダメージ${fmt(imm)}${vapor?'（蒸発）':''}`,'act')}
    else log(`${e.name}の火傷が続く。`);
    codexStatus('burn');render();
  }
  // 出血：敵がダメージを受けるたびに、追加ダメージ（時間では減らない）
  if(r.bleed&&resistCheck('bleed')){
    const d=Math.max(1,R((base||0)*r.bleed*sm*resOf('bleed'))),cur=e.bleed;
    e.bleed={t:3+dur,d:keep&&cur?Math.max(cur.d,d):d};
    log(`${e.name}は出血した！（ダメージを受けるたびに${fmt(d)}）${resNote('bleed')}`);codexStatus('bleed');render();
  }
  if(r.stun&&resistCheck('stun')){if(e.boss){e.weak=true;e.weakMul=wm;codexStatus('weak');log('ボスにはスタンが効かない！次の攻撃を弱体化！')}else{e.stun=1;codexStatus('stun');log(`${e.name}はスタンした！`)}render()}
  if(r.vulnerable&&resistCheck('vulnerable')){const vm2=vm+(resOf('vulnerable')>1?0.25:0);e.vulnerable=true;e.vulnMul=vm2;log(`${e.name}の防御の隙を作った！次の攻撃の被ダメージ${fmtM(+vm2.toFixed(2))}倍！${resNote('vulnerable')}`);codexStatus('vulnerable');render()}
  if(r.weaken&&resistCheck('weaken')){e.weak=true;e.weakMul=wm*(resOf('weaken')>1?0.8:1);log(`${e.name}の次の攻撃が弱まった！${resNote('weaken')}`);codexStatus('weak');render()}

    if(e.boss){e.weak=true;e.weakMul=wm;codexStatus('weak');log(`${e.name}の次の攻撃が弱まった！`)}

    render();
  }
}
// 出血：敵がダメージを受けるたびに、追加ダメージ（付与した行動そのもののダメージでは発動しない）
async function bleedTrigger(){
  const st=e.bleed;if(!st||e.hp<=0)return;
  const d=st.d;e.hp=Math.max(0,e.hp-d);st.t--;if(st.t<=0)e.bleed=null;
  rec(`【出血】${e.name}に出血ダメージ${fmt(d)}`,'take');log(`出血で${e.name}に${fmt(d)}のダメージ！`,true);popup('scene',d,'dmg');render();await sleep(220);
}
async function apply(r,P){
  if(r.gold){p.gold+=r.gold;log(`ゴールドレイン：${fmt(r.gold)}Gを得た！`);popup('pl','+'+fmt(r.gold)+'G','gold');render();}
  if(r.hpCost){p.hp=Math.max(1,p.hp-r.hpCost);log(`HPを${r.hpCost}支払った。`);popup('pl','-'+r.hpCost,'hurt');render();await sleep(250)}
  if(r.dbl){p.dbl=true;log('次のダメージが2倍になる！');render();await sleep(300)}
  let dealt=0;
  if(r.dmg){const res=runPipeline(r.dmg,P,false,ALL[p.currentSkill]);await cascade(res,r.note);let fin=res.final;const cc=roleCritChance(P);if(cc>0&&Math.random()<cc){fin=Math.max(1,R(fin*roleCritMul()));log('💥会心！',true);rec(`　会心！ダメージ×${fmtM(roleCritMul())}`,'act');popup('scene','会心！','dmg')}   // 会心（3）の目
    const d=await hit(fin);dealt=d;p.dbl=false;p.bank=0;if(equipped().some(it=>it.id==='chainorb'))p.chain=(p.chain||0)+1;if(r.drain&&d>0)healP(d);for(const it of equipped()){if(it.hit){const h=it.hit(d);if(h&&h.heal){p.hot=it.id;healP(h.heal)}}}p.hot=null}
  if(dealt>0&&e.bleed&&e.hp>0)await bleedTrigger();
  if(e.hp<=0)return;
  applyStatuses(r,false,P,dealt);
  if(dealt>0)itemStatusOnHit(dealt,P);
  if(r.heal){healP(r.heal);await sleep(300)}
  if(r.shield){
    let sh=r.shield;
    if(r.isGuard){const g=guardFinal(r.shield,P);if(g.steps.length)await cascade(g,r.note);sh=g.final}
    p.shield+=sh;log(`シールドを${sh}張った。`);render();await sleep(300);
  }
  if(r.barrier){p.barrier+=r.barrier;log(`バリアを${r.barrier}張った。`);render();await sleep(300)}
}
async function startBattle(){

// 行動の実行前に、魔力(4)の目でMPが回復する（「行動を実行」を押した時点の出目で）
async function roleTurnEnd(){
  const P=p.execP||pool(),parts=[];
  const mp=roleMana(P);
  if(mp>0&&p.mp<p.maxMp){const m=Math.min(mp,p.maxMp-p.mp);p.mp+=m;parts.push(`${ROLE[4].icon}MP+${m}`)}
  const tk=roleTakeMul(P);
  if(tk<1)parts.push(`${ROLE[2].icon}被ダメージ×${fmtM(+tk.toFixed(2))}`);
  if(parts.length){log(`目の役割：${parts.join('　')}`,true);rec(`【目の役割】${parts.join('　')}`,'act');render();await sleep(250)}
}
async function enemyAct(){
  if(e.stun>0){e.stun--;log(`${e.name}はスタンして動けない！`);render();await sleep(500);return}
  if(e.frozen){e.frozen=false;log(`${e.name}は凍りついて動けない！`);render();await sleep(500);return}
  const a=e.pat[e.idx%e.pat.length];e.idx++;
  if(a.m===0){log(`${e.name}は${a.n}。`);render();await sleep(500);return}
  log(`${e.name}の${a.n}！`,true);await sleep(320);
  let d=Math.round(e.atk*a.m);
  const dodger=equipped().find(it=>it.dodge&&Math.random()<it.dodge);if(dodger){log(`${dodger.name}で攻撃を回避した！`);render();await sleep(350);return}
  rec(`【${e.name}の攻撃】${a.n}：攻撃力${fmt(e.atk)}×${a.m}＝${fmt(d)}`,'take');
  if(has('armor')){d=Math.max(1,R(d*.85));rec(`　鉄の覚悟 ×0.85 → ${d}`,'take')}
  for(const it of equipped()){if(it.take){const f=it.take();if(f!==1){d=Math.max(1,R(d*f));rec(`　${it.name} ×${f} → ${d}`,'take')}}}
  const rt=roleTakeMul(p.execP||pool());if(rt<1){d=Math.max(1,R(d*rt));rec(`　${ROLE[2].icon}${ROLE[2].name}の目 ×${fmtM(+rt.toFixed(2))} → ${d}`,'take')}   // 耐久（2）の目：実行を押した時点の出目
  if(e.weak){d=Math.ceil(d*(e.weakMul||0.5));e.weak=false;rec(`　弱体化で×${fmtM(+(e.weakMul||0.5).toFixed(2))} → ${d}`,'take')}
  let blocked=0;
  if(p.shield>0){const x=Math.min(p.shield,d);p.shield-=x;d-=x;blocked+=x;rec(`　シールドが${x}防いだ → 残り${d}`,'take');log(`シールドが${x}防いだ！`,true)}
  if(d>0&&p.barrier>0){const x=Math.min(p.barrier,d);p.barrier-=x;d-=x;blocked+=x;rec(`　バリアが${x}防いだ → 残り${d}`,'take');log(`バリアが${x}防いだ！`,true)}
  if(blocked>0&&equipped().some(it=>it.id==='bulwark')){p.bank+=blocked*0.3;log(`要塞の鎧：防いだ分を力に変えた。`)}
  if(d>0){
    p.hp=Math.max(0,p.hp-d);
    if(p.hp<=0&&(p.undyingCharges||0)>0){p.undyingCharges--;p.hp=1;log('不死の加護でHP1で踏みとどまった！');popup('pl','耐えた','heal')}
    for(const it of equipped()){if(it.onTaken){const h=it.onTaken(d);if(h>0&&p.hp>0){p.hp=Math.min(p.maxHp,p.hp+h);log(`${it.name}：HPが${h}回復！`)}}}
    rec(`　▶ 勇者は${fmt(d)}のダメージ（HP ${fmt(p.hp)}/${fmt(p.maxHp)}）`,'take');
    log(`勇者は${fmt(d)}のダメージを受けた！`,true);popup('pl','-'+fmt(d),'hurt');flash();
    if(p.hp<=0&&!p.revived&&equipped().some(it=>it.id==='phoenix')){
      p.revived=true;p.hp=Math.max(1,R(p.maxHp*.6));
      rec(`　不死鳥の羽が輝いた！ HP ${fmt(p.hp)}で復活`,'take');log('不死鳥の羽が輝き、勇者は蘇った！');popup('pl','復活','heal');
    }
    if(p.hp>0)pstTry(a);   // HPにダメージが入ったときだけ、状態異常がかかることがある
    if(p.hp>0){
      for(const it of equipped()){
        if(!it.reflect)continue;
        const rf=R(it.reflect(d)*equipped().reduce((m,x)=>m*(x.refMul||1),1));
        if(rf>0&&e.hp>0){e.hp=Math.max(0,e.hp-rf);p.hot=it.id;log(`${it.name}：${e.name}に${fmt(rf)}の反射ダメージ！`);popup('scene',fmt(rf),'dmg');render();await sleep(300);p.hot=null}
      }
    }
  }else{rec('　▶ ダメージなし','take');popup('pl','0','miss');if(a.st&&blocked>0){rec('　シールドが状態異常も防いだ','take');log('防ぎきったので、状態異常はかからない！',true)}}
  render();await sleep(450);
}

  shuffle(Object.keys(DICE_T).filter(k=>k!=='normal'&&p.slots.length<18)).slice(0,2).forEach(k=>{
